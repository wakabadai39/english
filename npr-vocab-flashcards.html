ord":"calcite","general":"方解石","example":"Tiny calcite crystals were found inside the shell.","example_ja":"その殻の中から小さな方解石の結晶が見つかった。","source":"Science of Slime"},{"word":"induce","general":"引き起こす、誘発する","example":"Cold temperatures can induce the snail to produce thicker slime.","example_ja":"低温はカタツムリにより濃い粘液を作らせることを引き起こすことがある。","source":"Science of Slime"},{"word":"brittleness","general":"もろさ、脆弱性","example":"Drying out increases the slime's brittleness.","example_ja":"乾燥はその粘液のもろさを増す。","source":"Science of Slime"},{"word":"hibernation","general":"冬眠","example":"Some snails seal themselves in slime during hibernation.","example_ja":"一部のカタツムリは冬眠中、粘液で自分を封じ込める。","source":"Science of Slime"},{"word":"tweak","general":"調整する、微調整する","example":"Researchers tweaked the formula to make it more elastic.","example_ja":"研究者たちはその配合をより弾力性のあるものにするため微調整した。","source":"Science of Slime"},{"word":"adhesive","general":"接着性のある、粘着剤","example":"The slime acts as a natural adhesive underwater.","example_ja":"その粘液は水中で天然の接着剤として働く。","source":"Science of Slime"},{"word":"synthesize","general":"合成する","example":"The team managed to synthesize an artificial version of the slime.","example_ja":"そのチームはその粘液の人工版を合成することに成功した。","source":"Science of Slime"},{"word":"there is more to X than meets the eye","general":"Xには見た目以上のものがある","example":"There is more to snail slime than meets the eye.","example_ja":"カタツムリの粘液には見た目以上のものがある。","source":"Science of Slime"},{"word":"versatility","general":"多才、多芸、汎用性","example":"Scientists are amazed by the versatility of the material.","example_ja":"科学者たちはその素材の汎用性に驚いている。","source":"Science of Slime"},{"word":"along with ~","general":"〜に加えて、〜と共に","example":"Along with mucus, the snail also secretes a thin protective layer.","example_ja":"粘液に加えて、そのカタツムリは薄い保護層も分泌する。","source":"Science of Slime"},{"word":"phenomenally","general":"途方もなく、驚異的に","example":"The new energy project has been phenomenally successful.","example_ja":"その新しいエネルギープロジェクトは驚異的な成功を収めている。","source":"Red Sea Shipping"},{"word":"wage","general":"（戦争などを）行う、遂行する","example":"The two sides have waged a long economic battle over trade routes.","example_ja":"両者は貿易ルートをめぐって長い経済的な戦いを繰り広げてきた。","source":"Red Sea Shipping"},{"word":"it's only a matter of time before ~","general":"〜するのは時間の問題だ","example":"Analysts say it's only a matter of time before prices rise again.","example_ja":"アナリストたちは価格が再び上昇するのは時間の問題だと言う。","source":"Red Sea Shipping"},{"word":"disruption","general":"混乱、中断","example":"Shipping disruptions in the region have driven up costs.","example_ja":"その地域での海運の混乱がコストを押し上げている。","source":"Red Sea Shipping"},{"word":"strait","general":"海峡","example":"Tankers must pass through a narrow strait to reach the port.","example_ja":"タンカーはその港に着くために狭い海峡を通過しなければならない。","source":"Red Sea Shipping"},{"word":"Israeli","general":"イスラエルの","example":"The Israeli government responded to the attacks with new sanctions.","example_ja":"イスラエル政府はその攻撃に新たな制裁で対応した。","source":"Red Sea Shipping"},{"word":"irrelevant","general":"無関係な、重要性を失った","example":"Some experts say the old shipping routes have become irrelevant.","example_ja":"一部の専門家は古い海運ルートは重要性を失ったと言う。","source":"Red Sea Shipping"},{"word":"Treasury Secretary","general":"財務長官","example":"The Treasury Secretary announced new economic measures on Friday.","example_ja":"財務長官は金曜日に新たな経済対策を発表した。","source":"Red Sea Shipping"},{"word":"strike a hopeful note","general":"希望を感じさせる調子で述べる","example":"Officials struck a hopeful note despite the ongoing tensions.","example_ja":"当局者たちは緊張が続く中でも希望を感じさせる調子で述べた。","source":"Red Sea Shipping"},{"word":"assistant secretary","general":"次官補","example":"The assistant secretary met with foreign officials to discuss trade.","example_ja":"その次官補は貿易について協議するため外国当局者と会談した。","source":"Red Sea Shipping"},{"word":"envoy","general":"特使","example":"A special envoy was sent to negotiate a ceasefire.","example_ja":"特使が停戦交渉のために派遣された。","source":"Red Sea Shipping"},{"word":"varying stages","general":"さまざまな進捗段階","example":"The projects are at varying stages of completion.","example_ja":"そのプロジェクトはさまざまな進捗段階にある。","source":"Red Sea Shipping"},{"word":"constraint (on ~)","general":"制約、制限","example":"New sanctions placed further constraints on trade.","example_ja":"新たな制裁は貿易にさらなる制約を課した。","source":"Red Sea Shipping"},{"word":"Houthi","general":"フーシ派","example":"Houthi forces have attacked several ships in the region.","example_ja":"フーシ派の勢力はその地域でいくつかの船を攻撃した。","source":"Red Sea Shipping"},{"word":"come online","general":"稼働し始める、オンラインになる","example":"The new gas terminal is expected to come online next year.","example_ja":"その新しいガスターミナルは来年稼働し始める見込みだ。","source":"Red Sea Shipping"},{"word":"liquefied natural gas","general":"液化天然ガス（LNG）","example":"Exports of liquefied natural gas have surged this year.","example_ja":"液化天然ガスの輸出は今年急増した。","source":"Red Sea Shipping"},{"word":"fertilizer","general":"肥料","example":"Rising fertilizer prices have hurt farmers worldwide.","example_ja":"肥料価格の上昇は世界中の農家に打撃を与えている。","source":"Red Sea Shipping"},{"word":"choke","general":"要衝、ボトルネック地域（※choke pointなど）","example":"The narrow strait is considered a major choke point for global trade.","example_ja":"その狭い海峡は世界貿易にとって主要な要衝と考えられている。","source":"Red Sea Shipping"},{"word":"multibillion","general":"数十億の","example":"The country signed a multibillion-dollar energy deal.","example_ja":"その国は数十億ドル規模のエネルギー契約を結んだ。","source":"Red Sea Shipping"},{"word":"regional settlement","general":"地域協定、地域的解決","example":"Diplomats are pushing for a broader regional settlement.","example_ja":"外交官たちはより広範な地域協定を求めて働きかけている。","source":"Red Sea Shipping"},{"word":"offset","general":"相殺する","example":"Higher exports helped offset the drop in local demand.","example_ja":"輸出の増加が国内需要の減少を相殺するのに役立った。","source":"Red Sea Shipping"},{"word":"give a boost to ~","general":"〜の後押しをする、〜を元気づける","example":"The new deal is expected to give a boost to the local economy.","example_ja":"その新しい契約は地元経済の後押しになると見込まれている。","source":"Red Sea Shipping"},{"word":"substitutable","general":"代替可能な","example":"Some officials argue that the fuel is easily substitutable.","example_ja":"一部の当局者はその燃料は容易に代替可能だと主張している。","source":"Red Sea Shipping"},{"word":"be looking harder at ~","general":"腰を入れて検討する、より厳しく精査する","example":"Companies are looking harder at alternative shipping routes.","example_ja":"各企業は代替の海運ルートをより厳しく検討している。","source":"Red Sea Shipping"},{"word":"relieve","general":"和らげる、軽減する、救う","example":"The agreement is expected to relieve pressure on global energy prices.","example_ja":"その合意は世界のエネルギー価格への圧力を和らげると見込まれている。","source":"Red Sea Shipping"},{"word":"issue","general":"発行する","example":"The central bank plans to issue new bonds next month.","example_ja":"その中央銀行は来月、新しい債券を発行する予定だ。","source":"Red Sea Shipping"},{"word":"booming","general":"好調な、活況を呈している","example":"The tech sector has been booming this year.","example_ja":"そのIT分野は今年、活況を呈している。","source":"Economy Update"},{"word":"flush","general":"懐振りが良い（懐が暖かい）、金回りが良い","example":"The company is flush with cash after its record sales.","example_ja":"その会社は記録的な売上の後、資金が潤沢だ。","source":"Economy Update"},{"word":"paycheck(s)","general":"給料、給与小切手","example":"Many workers are stretching their paychecks further these days.","example_ja":"最近、多くの労働者は給料をやりくりして持たせている。","source":"Economy Update"},{"word":"dip into ~","general":"取崩す（切り崩す）、手をつける","example":"She had to dip into her savings to cover the bills.","example_ja":"彼女は請求を払うために貯金を取り崩さなければならなかった。","source":"Economy Update"},{"word":"anemic","general":"低調な、貧弱な、貧血の","example":"Economists described the job growth as anemic.","example_ja":"エコノミストたちはその雇用の伸びを低調だと表現した。","source":"Economy Update"},{"word":"subtract","general":"差し引く","example":"Subtract the discount from the total price.","example_ja":"その合計金額から割引分を差し引いてください。","source":"Economy Update"},{"word":"tally","general":"合計、集計","example":"The final tally showed a small increase in exports.","example_ja":"最終的な集計は輸出のわずかな増加を示した。","source":"Economy Update"},{"word":"trade deficit","general":"貿易赤字","example":"The country's trade deficit widened last quarter.","example_ja":"その国の貿易赤字は前四半期に拡大した。","source":"Economy Update"},{"word":"tariff(s)","general":"関税","example":"New tariffs raised the price of imported steel.","example_ja":"新たな関税は輸入鋼材の価格を押し上げた。","source":"Economy Update"},{"word":"strike down","general":"無効にする、破棄する","example":"The court struck down the tariff as unconstitutional.","example_ja":"裁判所はその関税を違憲として無効にした。","source":"Economy Update"},{"word":"on a tear","general":"絶好調で、勢いに乗って","example":"The stock market has been on a tear this month.","example_ja":"株式市場は今月、絶好調が続いている。","source":"Economy Update"},{"word":"pop up","general":"突然現れる","example":"New coffee shops keep popping up around the city.","example_ja":"新しいコーヒーショップが街中に次々と突然現れている。","source":"Economy Update"},{"word":"prop up","general":"ささえる、下支えする","example":"Government spending helped prop up the economy during the slump.","example_ja":"政府支出は不況の間、経済を下支えするのに役立った。","source":"Economy Update"},{"word":"devilishly","general":"ひどく、とてつもなく","example":"The math problem turned out to be devilishly hard.","example_ja":"その数学の問題はとてつもなく難しいと判明した。","source":"Economy Update"},{"word":"shaky","general":"不安定な","example":"Investors remain nervous about the shaky housing market.","example_ja":"投資家たちは不安定な住宅市場について依然として神経質になっている。","source":"Economy Update"},{"word":"tenuous","general":"不安定な、心もとない、薄弱な","example":"The recovery remains tenuous, economists warn.","example_ja":"その回復は依然として不安定だとエコノミストたちは警告している。","source":"Economy Update"},{"word":"dial back","general":"抑える、減らす","example":"The central bank may dial back interest rate hikes next year.","example_ja":"中央銀行は来年、利上げを抑えるかもしれない。","source":"Economy Update"},{"word":"weather","general":"乗り越える、切り抜ける","example":"Small businesses struggled to weather the economic downturn.","example_ja":"中小企業はその経済の低迷を乗り越えるのに苦労した。","source":"Economy Update"},{"word":"resilient","general":"回復力のある、しなやかな","example":"The labor market has proven remarkably resilient.","example_ja":"労働市場は驚くほど回復力があることが証明された。","source":"Economy Update"},{"word" hains to stop the demolition.","example_ja":"地元の保存活動家たちはその解体を止めるために騒ぎ立てて注意を引いた。","source":"Historic Cinema"},{"word":"preservationist","general":"保存活動家","example":"Preservationists fought for years to save the historic theater.","example_ja":"保存活動家たちはその歴史的な劇場を救うために何年も闘った。","source":"Historic Cinema"},{"word":"dormant","general":"休眠状態の、活動していない","example":"The theater sat dormant for nearly two decades.","example_ja":"その劇場はほぼ20年間、休眠状態のままだった。","source":"Historic Cinema"},{"word":"boarded up","general":"閉鎖された","example":"The windows had been boarded up since the theater closed.","example_ja":"その劇場が閉館して以来、窓は板で閉鎖されていた。","source":"Historic Cinema"},{"word":"demolition","general":"解体、取り壊し","example":"The building was scheduled for demolition before the campaign began.","example_ja":"その建物はキャンペーンが始まる前、解体が予定されていた。","source":"Historic Cinema"},{"word":"rally","general":"集会","example":"Supporters held a rally outside the old theater.","example_ja":"支持者たちはその古い劇場の外で集会を開いた。","source":"Historic Cinema"},{"word":"petition","general":"請願、署名活動","example":"More than 5,000 people signed the petition to save the cinema.","example_ja":"5,000人以上がその映画館を救うための署名活動に署名した。","source":"Historic Cinema"},{"word":"buzz","general":"話題を呼ぶ","example":"The reopening created a lot of buzz in the community.","example_ja":"その再開は地域社会で大きな話題を呼んだ。","source":"Historic Cinema"},{"word":"be treated to ~","general":"楽しむ、堪能する","example":"Guests were treated to a screening of the original 1977 print.","example_ja":"来場者たちは1977年のオリジナルプリントの上映を堪能した。","source":"Historic Cinema"}];
const STORAGE_KEY = 'npr-vocab-flashcards-progress-v4';
WORDS.forEach((w, i) => { w.idx = i; });

const BOX_INTERVALS_DAYS = [1, 3, 7, 14, 30];
const MAX_BOX = 5;

function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function addDays(dateStr, days){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

let progress = {};
try{
  progress = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
}catch(e){ progress = {}; }

let currentSource = 'ALL';
let reviewMode = false;
let reviewFilter = 'due';
let reviewIndex = 0;
let reviewConfirmed = new Set();
let deck = [];
let originalOrder = [];
let history = [];
let flipped = false;
let loopingWord = null;

function saveProgress(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
  }catch(e){}
}

function getState(idx){
  return progress[idx] || { box: 0, nextReview: todayStr() };
}

function sourceFilteredWords(){
  if(currentSource === 'ALL') return WORDS;
  return WORDS.filter(w => w.source === currentSource);
}

function isDue(idx){
  const st = getState(idx);
  return st.box === 0 || st.nextReview <= todayStr();
}

// Review mode: loads ALL matching learned words into the deck at once
// (like DUO 3.0), so they can be swiped through with 次へ／習得済み ✓
// just like normal study — no need to click each word individually.
// reviewFilter 'due' = only words whose scheduled date has arrived.
// reviewFilter 'all' = every word ever marked 習得済み, regardless of date
// (use this to review everything you just learned today in one session).
function buildDeck(){
  const pool = sourceFilteredWords();
  if(reviewMode){
    const learned = pool.filter(w => getState(w.idx).box >= 1);
    let filtered;
    if(reviewFilter === 'all'){
      filtered = learned;
    } else if(reviewFilter === 'due'){
      filtered = learned.filter(w => isDue(w.idx));
    } else {
      const wantBox = parseInt(reviewFilter.slice(1), 10);
      filtered = learned.filter(w => getState(w.idx).box === wantBox);
    }
    filtered.sort((a, b) => getState(a.idx).nextReview.localeCompare(getState(b.idx).nextReview));
    deck = filtered;
  } else {
    deck = pool.filter(w => isDue(w.idx));
  }
  originalOrder = deck.slice();
  history = [];
}

function renderSourceFilter(){
  const sel = document.getElementById('sourceFilter');
  const sources = Array.from(new Set(WORDS.map(w => w.source)));
  sel.innerHTML = '';
  const optAll = document.createElement('option');
  optAll.value = 'ALL';
  optAll.textContent = 'すべての記事（' + WORDS.length + '語）';
  sel.appendChild(optAll);
  sources.forEach(s => {
    const count = WORDS.filter(w => w.source === s).length;
    const opt = document.createElement('option');
    opt.value = s;
    opt.textContent = s + '（' + count + '語）';
    sel.appendChild(opt);
  });
  sel.addEventListener('change', () => {
    currentSource = sel.value;
    buildDeck();
    render();
  });
}

function speakOnce(word, onEnd){
  const utter = new SpeechSynthesisUtterance(word);
  utter.lang = 'en-US';
  utter.rate = 0.85;
  utter.onend = onEnd;
  utter.onerror = onEnd;
  window.speechSynthesis.speak(utter);
}

function startLoop(word){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  loopingWord = word;
  const btn = document.querySelector('.speak-btn');
  if(btn) btn.classList.add('looping');

  const playNext = () => {
    if(loopingWord !== word) return;
    speakOnce(word, () => {
      if(loopingWord !== word) return;
      setTimeout(() => {
        if(loopingWord === word) playNext();
      }, 170);
    });
  };
  playNext();
}

function stopLoop(){
  loopingWord = null;
  window.speechSynthesis.cancel();
  const btn = document.querySelector('.speak-btn');
  if(btn) btn.classList.remove('looping');
}

function updateProgress(){
  const total = WORDS.length;
  const learnedAtLeastOnce = WORDS.filter(w => getState(w.idx).box >= 1).length;
  const masteredCount = WORDS.filter(w => getState(w.idx).box >= MAX_BOX).length;
  const pool = sourceFilteredWords();
  const dueCount = pool.filter(w => isDue(w.idx)).length;

  document.getElementById('progressLabel').textContent = `${masteredCount} / ${total} 定着`;
  document.getElementById('progressFill').style.width = `${(learnedAtLeastOnce/total)*100}%`;
  document.getElementById('dueLabel').textContent = reviewMode
    ? `復習対象: ${deck.length}語`
    : `本日の新規・復習: ${dueCount}語`;
  document.getElementById('totalLabel').textContent = `全カード: ${total}語`;

  const remaining = deck.length;
  document.getElementById('remainingLabel').textContent = remaining > 0 ? `残り ${remaining} 語` : '';

  const positionLabel = document.getElementById('positionLabel');
  const prevBtn = document.getElementById('prevBtn');
  const restartBtn = document.getElementById('restartBtn');
  const curForLabel = reviewMode ? deck[reviewIndex] : deck[0];
  if(remaining > 0 && originalOrder.length > 0 && curForLabel){
    const posIdx = originalOrder.findIndex(w => w.idx === curForLabel.idx);
    const displayIdx = posIdx >= 0 ? posIdx + 1 : '?';
    positionLabel.textContent = `${displayIdx} / ${originalOrder.length} 枚目`;
  } else {
    positionLabel.textContent = '';
  }
  if(prevBtn) prevBtn.disabled = history.length === 0;
  if(restartBtn) restartBtn.disabled = originalOrder.length === 0;
}

function speakerIcon(){
  return `<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.06c1.48-.74 2.5-2.26 2.5-4.03zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>`;
}

function boxLabel(idx){
  const st = getState(idx);
  if(st.box >= MAX_BOX) return '定着済み';
  if(st.box === 0) return '新規';
  return `Box ${st.box}`;
}

// ---- Auto-fit headword to a single line (never wraps mid-word) ----
function fitWordFont(){
  const wordEl = document.querySelector('#currentCard .word');
  const row = document.querySelector('#currentCard .word-row');
  if(!wordEl || !row) return;
  const speakBtn = row.querySelector('.speak-btn');
  const reserve = speakBtn ? speakBtn.offsetWidth + 18 : 0;
  const available = row.clientWidth - reserve - 4;
  let size = 30;
  const minSize = 14;
  wordEl.style.whiteSpace = 'nowrap';
  wordEl.style.display = 'inline-block';
  wordEl.style.fontSize = size + 'px';
  while(wordEl.scrollWidth > available && size > minSize){
    size -= 1;
    wordEl.style.fontSize = size + 'px';
  }
}

function frontHTML(current){
  const st = getState(current.idx);
  const isMastered = st.box >= 1;
  return `
    <span class="source-tag">${current.source}</span>
    <div class="box-badge">${boxLabel(current.idx)}</div>
    ${!reviewMode ? `
    <label class="master-checkbox-row">
      <input type="checkbox" id="masterCb" ${isMastered ? 'checked' : ''}>
      <span>マスター</span>
    </label>` : ''}
    <div class="eyebrow">タップして意味を見る</div>
    <div class="word-row">
      <div class="word">${current.word}</div>
      <button class="speak-btn" id="speakBtn" title="発音を聞く">${speakerIcon()}</button>
    </div>
    <div class="tap-hint">単語をタップ / クリック</div>
  `;
}

function backHTML(current){
  const st = getState(current.idx);
  const isMastered = st.box >= 1;
  return `
    <div class="back-scroll">
      ${!reviewMode ? `
      <label class="master-checkbox-row-inline">
        <input type="checkbox" id="masterCb" ${isMastered ? 'checked' : ''}>
        <span>マスター</span>
      </label>` : ''}
      <div class="word-back-row">
        <div class="word-back">${current.word}</div>
        <button class="speak-btn" id="speakBtn" title="発音を聞く">${speakerIcon()}</button>
      </div>
      <div class="hint-block">
        <div class="hint-label">意味</div>
        <div class="hint-text">${current.general}</div>
        ${current.example ? `
        <div class="general-block">
          <div class="general-label">EXAMPLE（タップで読み上げ）</div>
          <div class="general-text example-en" id="exampleSentence">${current.example}</div>
          <div class="example-ja-text">${current.example_ja}</div>
        </div>` : ''}
      </div>
      <div class="back-tap-hint tap-hint">タップで単語に戻る</div>
    </div>
  `;
}

function attachSpeakHandler(current){
  const speakBtn = document.getElementById('speakBtn');
  if(speakBtn){
    speakBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if(loopingWord === current.word){
        stopLoop();
      } else {
        startLoop(current.word);
      }
    });
  }
  const exampleEl = document.getElementById('exampleSentence');
  if(exampleEl){
    exampleEl.addEventListener('click', (e) => {
      e.stopPropagation();
      speakOnce(current.example, () => {});
    });
  }
  const masterCb = document.getElementById('masterCb');
  if(masterCb){
    masterCb.addEventListener('click', (e) => e.stopPropagation());
    masterCb.addEventListener('change', (e) => {
      if(reviewMode) return;
      nextCard(e.target.checked);
    });
  }
}

function currentCard(){
  if(reviewMode){
    if(deck.length === 0) return null;
    if(reviewIndex >= deck.length) reviewIndex = 0;
    return deck[reviewIndex];
  }
  return deck[0] || null;
}

function render(){
  stopLoop();
  const stage = document.getElementById('stage');
  const controls = document.getElementById('controls');
  const skipBtn = document.getElementById('skipBtn');
  const masterBtn = document.getElementById('masterBtn');
  const controlsSecondary = document.getElementById('controlsSecondary');

  // Relabel the two main buttons depending on mode.
  // Review mode = pure browsing (← 前へ / 次へ →) plus a separate,
  // explicit confirm action. Simply moving between cards NEVER changes
  // a word's box or schedule — only pressing 復習完了 does.
  if(reviewMode){
    skipBtn.textContent = '次へ（スキップ）';
    masterBtn.textContent = '✓ 覚えている（復習完了）';
    masterBtn.style.display = '';
    controlsSecondary.style.display = 'none';
  } else {
    skipBtn.textContent = '次へ（まだ）';
    masterBtn.style.display = 'none';
  }

  const current = currentCard();

  if(!current){
    stage.innerHTML = `
      <div class="empty-state">
        <div class="word">${reviewMode ? '復習する単語がありません' : 'よくできました'}</div>
        <p>${reviewMode
          ? (reviewFilter === 'due'
              ? '今日、復習日を迎えている単語は今のところありません。<br>上のプルダウンで「すべて」に切り替えると、日付に関係なくこれまでマスターした単語をまとめて確認できます。'
              : reviewFilter === 'all'
                ? 'まだ一度も「マスター」にチェックを入れた単語がありません。<br>通常モードで単語を学習すると、ここに復習対象として表示されます。'
                : 'このサイクルに該当する単語は今のところありません。')
          : '本日の新規学習・復習はこれで終わりです。<br>「🔁 これまでの単語を復習する」で、今までマスターした単語をまとめて確認できます。'}</p>
      </div>
    `;
    controls.style.display = 'none';
    controlsSecondary.style.display = 'none';
    updateProgress();
    return;
  }

  controls.style.display = 'flex';
  if(!reviewMode) controlsSecondary.style.display = 'flex';
  flipped = false;

  const nextPeek = reviewMode ? null : deck[1];

  stage.innerHTML = `
    ${nextPeek ? `<div class="card behind"></div>` : ''}
    <div class="card front" id="currentCard">
      ${frontHTML(current)}
    </div>
  `;

  document.getElementById('currentCard').addEventListener('click', (e) => {
    if(e.target.closest('.speak-btn')) return;
    flipCard();
  });

  attachSpeakHandler(current);
  requestAnimationFrame(fitWordFont);

  updateProgress();
}

function flipCard(){
  if(flipped) {
    showFront();
    return;
  }
  stopLoop();
  const card = document.getElementById('currentCard');
  const current = currentCard();
  if(!current) return;
  flipped = true;

  card.classList.add('flipping');
  setTimeout(() => {
    card.classList.add('flipped-card');
    card.innerHTML = backHTML(current);
    attachSpeakHandler(current);
    card.classList.remove('flipping');
  }, 220);
}

function showFront(){
  const card = document.getElementById('currentCard');
  const current = currentCard();
  if(!current) return;
  flipped = false;
  card.classList.add('flipping');
  setTimeout(() => {
    card.classList.remove('flipped-card');
    card.innerHTML = frontHTML(current);
    attachSpeakHandler(current);
    requestAnimationFrame(fitWordFont);
    card.classList.remove('flipping');
  }, 220);
}

// ---------- Normal (first-time learning) mode ----------
// Grading here intentionally shrinks the live queue as you go, since the
// point of this mode is to whittle down to only the words you don't know yet.
function nextCard(gotIt){
  const card = document.getElementById('currentCard');
  if(!card){ return; }

  const current = deck[0];
  const prevState = Object.assign({}, getState(current.idx));

  history.push({
    idx: current.idx,
    gotIt: gotIt,
    prevState: prevState
  });

  const st = getState(current.idx);
  if(gotIt){
    st.box = Math.min(MAX_BOX, st.box + 1);
    st.nextReview = addDays(todayStr(), BOX_INTERVALS_DAYS[st.box - 1]);
  } else {
    st.box = 0;
    st.nextReview = todayStr();
  }
  progress[current.idx] = st;
  saveProgress();

  card.classList.add('exit-left');

  setTimeout(() => {
    deck.shift();
    render();
  }, 260);
}

function prevCard(){
  if(history.length === 0) return;
  const last = history.pop();

  progress[last.idx] = last.prevState;
  saveProgress();

  const w = WORDS[last.idx];
  if(w) deck.unshift(w);

  render();
}

// ---------- Review mode ----------
// Browsing (←前へ / 次へ→) NEVER touches box/schedule data — it is pure
// navigation over a fixed list that loops around. Only the explicit
// 復習完了 button advances a word's box, and the word stays in the list
// so you can keep browsing back to it in the same session.
function reviewNext(){
  if(deck.length === 0) return;
  reviewIndex = (reviewIndex + 1) % deck.length;
  render();
}

function reviewPrev(){
  if(deck.length === 0) return;
  reviewIndex = (reviewIndex - 1 + deck.length) % deck.length;
  render();
}

function confirmReview(){
  const current = currentCard();
  if(!current) return;
  if(reviewConfirmed.has(current.idx)) return;
  reviewConfirmed.add(current.idx);
  const st = getState(current.idx);
  st.box = Math.min(MAX_BOX, st.box + 1);
  st.nextReview = addDays(todayStr(), BOX_INTERVALS_DAYS[st.box - 1]);
  progress[current.idx] = st;
  saveProgress();
  const card = document.getElementById('currentCard');
  if(card) card.classList.add('confirmed-flash');
  setTimeout(() => {
    const pos = deck.findIndex(w => w.idx === current.idx);
    if(pos !== -1) deck.splice(pos, 1);
    if(reviewIndex >= deck.length) reviewIndex = 0;
    reviewConfirmed.delete(current.idx);
    render();
  }, 260);
}

function restartDeck(){
  buildDeck();
  render();
}

document.getElementById('skipBtn').addEventListener('click', () => {
  if(reviewMode) reviewNext(); else nextCard(false);
});
document.getElementById('masterBtn').addEventListener('click', () => {
  if(reviewMode) confirmReview(); else nextCard(true);
});
document.getElementById('prevBtn').addEventListener('click', () => prevCard());
document.getElementById('restartBtn').addEventListener('click', () => restartDeck());

document.getElementById('resetBtn').addEventListener('click', () => {
  if(confirm('学習の記録（復習スケジュール）をすべてリセットしますか？')){
    progress = {};
    saveProgress();
    buildDeck();
    render();
  }
});

document.getElementById('reviewToggleBtn').addEventListener('click', () => {
  reviewMode = !reviewMode;
  reviewIndex = 0;
  reviewConfirmed.clear();
  const btn = document.getElementById('reviewToggleBtn');
  const banner = document.getElementById('reviewBanner');
  btn.textContent = reviewMode ? '↩ 学習モードに戻る' : '🔁 これまでの単語を復習する';
  btn.classList.toggle('btn-on', reviewMode);
  banner.classList.toggle('show', reviewMode);
  buildDeck();
  render();
});

document.getElementById('reviewFilterSelect').addEventListener('change', (e) => {
  reviewFilter = e.target.value;
  reviewIndex = 0;
  if(reviewMode){
    buildDeck();
    render();
  }
});

document.addEventListener('keydown', (e) => {
  if(e.code === 'Space'){
    e.preventDefault();
    flipCard();
  } else if(e.code === 'ArrowRight'){
    if(reviewMode) reviewNext(); else nextCard(false);
  } else if(e.code === 'ArrowLeft'){
    if(reviewMode) reviewPrev(); else prevCard();
  } else if(e.code === 'Enter'){
    if(reviewMode) confirmReview(); else nextCard(true);
  }
});

window.addEventListener('resize', () => { if(!flipped) fitWordFont(); });

renderSourceFilter();
buildDeck();
render();
</script>
