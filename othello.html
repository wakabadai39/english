<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>最強オセロ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Shippori+Mincho:wght@700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one column. Felt board is the hero; score bar above, controls and move record below. */
:root {
  --bg: #e7eee9;
  --surface: #f5f8f5;
  --fg: #12201a;
  --muted: #55655c;
  --line: #c4d0c7;
  --felt: #1f6a4a;
  --felt-line: #14503a;
  --gold: #d9a21b;
  --on-active: #f5f8f5;
  --active: #12201a;
  --disc-b: #141414;
  --disc-w: #f2f2ee;
  --font-display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --font-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1511; --surface: #16211b; --fg: #e5eee8; --muted: #8da095; --line: #2a3a31;
    --felt: #1a5a3f; --felt-line: #0f3b29; --gold: #e6b83d; --on-active: #0d1511; --active: #e5eee8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1511; --surface: #16211b; --fg: #e5eee8; --muted: #8da095; --line: #2a3a31;
  --felt: #1a5a3f; --felt-line: #0f3b29; --gold: #e6b83d; --on-active: #0d1511; --active: #e5eee8;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-inline: 16px; padding-block: 20px 44px;
}
.app { max-width: 34rem; margin-inline: auto; display: flex; flex-direction: column; gap: 14px; }
.head { display: flex; flex-direction: column; gap: 2px; }
h1 {
  margin: 0; font-family: var(--font-display); font-weight: 700;
  font-size: clamp(1.9rem, 8vw, 2.5rem); line-height: 1.15; letter-spacing: .04em; text-wrap: balance;
}
.sub { margin: 0; font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }

.scorebar { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; }
.pl { display: flex; align-items: center; gap: 8px; padding-block: 4px; border-bottom: 2px solid transparent; min-width: 0; }
.pl.turn { border-bottom-color: var(--gold); }
.chip { width: 22px; height: 22px; border-radius: 50%; flex: none; box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(0,0,0,.35); }
.chip.b { background: radial-gradient(circle at 35% 30%, #4a4a4a, var(--disc-b) 70%); }
.chip.w { background: radial-gradient(circle at 35% 30%, #fff, #d4d6d0 75%); }
.who { font-size: 12px; color: var(--muted); line-height: 1.2; }
.n { font-family: var(--font-mono); font-weight: 500; font-size: 1.6rem; line-height: 1; font-variant-numeric: tabular-nums; min-width: 1.4ch; text-align: right; }
.evalwrap { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.evalbar { height: 8px; border-radius: 4px; border: 1px solid var(--line); background: linear-gradient(90deg, var(--disc-b) var(--p, 50%), var(--disc-w) var(--p, 50%)); transition: background .4s; }
.evalcap { font-family: var(--font-mono); font-size: 10px; letter-spacing: .06em; color: var(--muted); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.status { margin: 0; min-height: 1.7em; font-weight: 700; }
.boardwrap { display: grid; grid-template-columns: 1.3rem minmax(0, 1fr); grid-template-rows: 1.3rem auto; }
.files, .ranks { display: grid; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.files { grid-column: 2; grid-template-columns: repeat(8, 1fr); text-align: center; align-items: center; }
.ranks { grid-row: 2; grid-template-rows: repeat(8, 1fr); align-items: center; justify-items: start; }
.board {
  display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); width: 100%; aspect-ratio: 1;
  background: var(--felt); border: 3px solid var(--felt-line); border-radius: 4px; overflow: hidden;
  box-shadow: 0 6px 18px rgba(0,0,0,.22);
}
.cell {
  position: relative; display: block; padding: 0; margin: 0; border: 0; background: var(--felt);
  box-shadow: inset 0 0 0 .5px var(--felt-line); perspective: 340px; min-width: 0; cursor: default; font: inherit; color: inherit;
}
.cell.star::before { content: ""; position: absolute; width: 12%; aspect-ratio: 1; border-radius: 50%; background: var(--felt-line); right: -6%; bottom: -6%; z-index: 1; }
.cell:focus-visible { outline: 2px solid var(--gold); outline-offset: -3px; z-index: 3; }
.cell.hint { cursor: pointer; }
.cell.hint::after { content: ""; position: absolute; inset: 39%; border-radius: 50%; background: rgba(255,255,255,.3); transition: background .15s, inset .15s; }
.cell.hint:hover::after { background: rgba(255,255,255,.6); inset: 33%; }
.disc { position: absolute; inset: 10%; border-radius: 50%; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.3,.7,.3,1); }
.disc[data-c=""] { transform: rotateY(0deg) scale(0); }
.disc[data-c="b"] { transform: rotateY(0deg) scale(1); }
.disc[data-c="w"] { transform: rotateY(180deg) scale(1); }
.f { position: absolute; inset: 0; border-radius: 50%; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.f.b { background: radial-gradient(circle at 35% 30%, #4d4d4d, var(--disc-b) 68%); box-shadow: 0 2px 3px rgba(0,0,0,.5); }
.f.w { transform: rotateY(180deg); background: radial-gradient(circle at 35% 30%, #fff, #d2d4cf 76%); box-shadow: 0 2px 3px rgba(0,0,0,.4); }
.mk { position: absolute; left: 50%; top: 50%; width: 15%; aspect-ratio: 1; border-radius: 50%; background: var(--gold); transform: translate(-50%, -50%); z-index: 2; display: none; box-shadow: 0 0 0 1px rgba(0,0,0,.35); }
.cell.last .mk { display: block; }

.aiinfo { margin: 0; min-height: 3.3em; font-size: 13px; color: var(--muted); }
.aiinfo .m { font-family: var(--font-mono); font-size: 12px; color: var(--fg); font-variant-numeric: tabular-nums; }
.aiinfo .solved { color: var(--fg); font-weight: 700; }

.ctl { display: flex; flex-direction: column; gap: 14px; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend { padding: 0; margin-bottom: 6px; font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; border-right: 1px solid var(--line); background: transparent; color: var(--fg); font: inherit; font-size: 14px; font-weight: 500; padding: 8px 4px 7px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0; min-width: 0; line-height: 1.35; }
.seg button:last-child { border-right: 0; }
.seg button small { font-family: var(--font-mono); font-size: 10px; color: var(--muted); letter-spacing: .02em; }
.seg button[aria-pressed="true"] { background: var(--active); color: var(--on-active); }
.seg button[aria-pressed="true"] small { color: inherit; opacity: .75; }
.seg button:focus-visible, .btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.note { margin: 6px 0 0; font-size: 12px; color: var(--muted); }
.actions { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; font-size: 14px; font-weight: 700; padding: 10px 6px; border-radius: 6px; cursor: pointer; min-width: 0; }
.btn.primary { background: var(--active); color: var(--on-active); border-color: var(--active); }
.btn[aria-pressed="false"] { color: var(--muted); font-weight: 500; }
.btn:disabled { opacity: .45; cursor: default; }

.kifu h2 { margin: 0 0 6px; font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: .04em; }
.kifu p { margin: 0; padding: 8px 10px; max-height: 6.2em; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-family: var(--font-mono); font-size: 12.5px; line-height: 1.8; word-break: break-word; }

@media (prefers-reduced-motion: reduce) {
  .disc, .evalbar, .cell.hint::after { transition: none; }
}
</style>

<main class="app">
  <header class="head">
    <h1>最強オセロ</h1>
    <p class="sub">α-β search · iterative deepening · exact endgame</p>
  </header>

  <section class="scorebar" aria-label="スコア">
    <div class="pl" id="plB"><span class="chip b"></span><span class="who" id="whoB">あなた</span><span class="n" id="nB">2</span></div>
    <div class="evalwrap">
      <div class="evalbar" id="evalbar" role="img" aria-label="AIの形勢判断"></div>
      <div class="evalcap" id="evalcap">AIの形勢</div>
    </div>
    <div class="pl" id="plW"><span class="n" id="nW">2</span><span class="who" id="whoW">AI</span><span class="chip w"></span></div>
  </section>

  <p class="status" id="status" aria-live="polite"></p>

  <div class="boardwrap">
    <div class="files" aria-hidden="true"><span>a</span><span>b</span><span>c</span><span>d</span><span>e</span><span>f</span><span>g</span><span>h</span></div>
    <div class="ranks" aria-hidden="true"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span></div>
    <div class="board" id="board"></div>
  </div>

  <p class="aiinfo" id="aiinfo" aria-live="polite"></p>

  <section class="ctl">
    <fieldset>
      <legend>AIの強さ</legend>
      <div class="seg" id="levelSeg"></div>
    </fieldset>
    <fieldset>
      <legend>あなたの色</legend>
      <div class="seg" id="sideSeg">
        <button type="button" id="sideB" aria-pressed="true">黒（先手）</button>
        <button type="button" id="sideW" aria-pressed="false">白（後手）</button>
      </div>
      <p class="note">色の変更は次の対局から反映されます。</p>
    </fieldset>
    <div class="actions">
      <button type="button" class="btn primary" id="newBtn">新しい対局</button>
      <button type="button" class="btn" id="undoBtn">一手戻す</button>
      <button type="button" class="btn" id="hintBtn" aria-pressed="true">候補手</button>
    </div>
  </section>

  <section class="kifu">
    <h2>棋譜</h2>
    <p id="kifu">—</p>
  </section>
</main>

<script>
function makeEngine(midBits, solveBits) {
  "use strict";
  // Board: 64 squares, index = row*8 + col (a1 = 0, h1 = 7, a8 = 56). Bitboard split in lo (0-31) / hi (32-63).
  const NOT_A = 0xFEFEFEFE | 0, NOT_H = 0x7F7F7F7F | 0, INF = 1e9;
  const ABORT = { abort: true };
  let SL = 0, SH = 0, ML = 0, MH = 0, FL = 0, FH = 0;
  let nodes = 0, deadline = Infinity;
  const perf = (typeof performance !== "undefined") ? function () { return performance.now(); } : function () { return Date.now(); };

  function pop(x) {
    x = x | 0;
    x = x - ((x >>> 1) & 0x55555555);
    x = (x & 0x33333333) + ((x >>> 2) & 0x33333333);
    x = (x + (x >>> 4)) & 0x0F0F0F0F;
    return Math.imul(x, 0x01010101) >>> 24;
  }

  function sh(d, lo, hi) {
    switch (d) {
      case 0: SL = (lo << 1) & NOT_A; SH = ((hi << 1) | (lo >>> 31)) & NOT_A; break;
      case 1: SL = ((lo >>> 1) | (hi << 31)) & NOT_H; SH = (hi >>> 1) & NOT_H; break;
      case 2: SL = lo << 8; SH = (hi << 8) | (lo >>> 24); break;
      case 3: SL = (lo >>> 8) | (hi << 24); SH = hi >>> 8; break;
      case 4: SL = (lo << 7) & NOT_H; SH = ((hi << 7) | (lo >>> 25)) & NOT_H; break;
      case 5: SL = (lo << 9) & NOT_A; SH = ((hi << 9) | (lo >>> 23)) & NOT_A; break;
      case 6: SL = ((lo >>> 7) | (hi << 25)) & NOT_A; SH = (hi >>> 7) & NOT_A; break;
      default: SL = ((lo >>> 9) | (hi << 23)) & NOT_H; SH = (hi >>> 9) & NOT_H; break;
    }
  }

  function moves(pl, ph, ol, oh) {
    const el = ~(pl | ol), eh = ~(ph | oh);
    let ml = 0, mh = 0;
    for (let d = 0; d < 8; d++) {
      sh(d, pl, ph);
      let tl = SL & ol, th = SH & oh;
      for (let i = 0; i < 5; i++) {
        sh(d, tl, th);
        tl |= SL & ol; th |= SH & oh;
      }
      sh(d, tl, th);
      ml |= SL & el; mh |= SH & eh;
    }
    ML = ml; MH = mh;
  }

  function flips(pl, ph, ol, oh, s) {
    const ml = s < 32 ? (1 << s) : 0, mh = s >= 32 ? (1 << (s - 32)) : 0;
    let fl = 0, fh = 0;
    for (let d = 0; d < 8; d++) {
      sh(d, ml, mh);
      let xl = SL, xh = SH, ll = 0, lh = 0;
      while (((xl & ol) | (xh & oh)) !== 0) {
        ll |= xl; lh |= xh;
        sh(d, xl, xh); xl = SL; xh = SH;
      }
      if (((xl & pl) | (xh & ph)) !== 0) { fl |= ll; fh |= lh; }
    }
    FL = fl; FH = fh;
  }

  // ---- evaluation ----
  function sqMask(list) {
    let l = 0, h = 0;
    for (let i = 0; i < list.length; i++) {
      const s = list[i];
      if (s < 32) l |= 1 << s; else h |= 1 << (s - 32);
    }
    return [l | 0, h | 0];
  }
  const cm = sqMask([0, 7, 56, 63]), CL = cm[0], CH = cm[1];
  const em = sqMask([2, 3, 4, 5, 16, 24, 32, 40, 23, 31, 39, 47, 58, 59, 60, 61]), EL = em[0], EH = em[1];
  const CORNER_SQ = [0, 7, 56, 63];
  const XSQ = [[9], [14], [49], [54]];
  const CSQ = [[1, 8], [6, 15], [48, 57], [55, 62]];
  const CRL = [], CRH = [], XL = [], XH = [], CCL = [], CCH = [];
  for (let k = 0; k < 4; k++) {
    const a = sqMask([CORNER_SQ[k]]), b = sqMask(XSQ[k]), c = sqMask(CSQ[k]);
    CRL.push(a[0]); CRH.push(a[1]); XL.push(b[0]); XH.push(b[1]); CCL.push(c[0]); CCH.push(c[1]);
  }
  const RAYS = [
    [1, 2, 3, 4, 5, 6, 7], [8, 16, 24, 32, 40, 48, 56],
    [6, 5, 4, 3, 2, 1, 0], [15, 23, 31, 39, 47, 55, 63],
    [57, 58, 59, 60, 61, 62, 63], [48, 40, 32, 24, 16, 8, 0],
    [62, 61, 60, 59, 58, 57, 56], [55, 47, 39, 31, 23, 15, 7]
  ];
  function getb(s, l, h) { return s < 32 ? (l >>> s) & 1 : (h >>> (s - 32)) & 1; }
  // corner-anchored stable discs along edges
  function stable(l, h) {
    let sl = 0, sh2 = 0;
    for (let k = 0; k < 4; k++) {
      const cs = CORNER_SQ[k];
      if (!getb(cs, l, h)) continue;
      if (cs < 32) sl |= 1 << cs; else sh2 |= 1 << (cs - 32);
      for (let r = 2 * k; r < 2 * k + 2; r++) {
        const ray = RAYS[r];
        for (let j = 0; j < 7; j++) {
          const q = ray[j];
          if (!getb(q, l, h)) break;
          if (q < 32) sl |= 1 << q; else sh2 |= 1 << (q - 32);
        }
      }
    }
    return pop(sl) + pop(sh2);
  }

  function evaluate(pl, ph, ol, oh, ml, mh) {
    const pc = pop(pl) + pop(ph), oc = pop(ol) + pop(oh), e = 64 - pc - oc;
    moves(ol, oh, pl, ph);
    const oml = ML, omh = MH;
    const mP = pop(ml) + pop(mh), mO = pop(oml) + pop(omh);
    let s = 0;
    s += 350 * (pop(pl & CL) + pop(ph & CH) - pop(ol & CL) - pop(oh & CH));
    for (let k = 0; k < 4; k++) {
      if ((((pl | ol) & CRL[k]) | ((ph | oh) & CRH[k])) !== 0) continue;
      s -= 130 * (pop(pl & XL[k]) + pop(ph & XH[k]) - pop(ol & XL[k]) - pop(oh & XH[k]));
      s -= 55 * (pop(pl & CCL[k]) + pop(ph & CCH[k]) - pop(ol & CCL[k]) - pop(oh & CCH[k]));
    }
    s += 18 * (pop(pl & EL) + pop(ph & EH) - pop(ol & EL) - pop(oh & EH));
    const wm = e > 40 ? 80 : (e > 20 ? 65 : 45);
    s += wm * (mP - mO);
    s += 120 * (pop(ml & CL) + pop(mh & CH) - pop(oml & CL) - pop(omh & CH));
    const el = ~(pl | ol), eh = ~(ph | oh);
    let dl = 0, dh = 0;
    for (let d = 0; d < 8; d++) { sh(d, el, eh); dl |= SL; dh |= SH; }
    s -= 22 * (pop(pl & dl) + pop(ph & dh) - pop(ol & dl) - pop(oh & dh));
    s += 110 * (stable(pl, ph) - stable(ol, oh));
    if (e < 30) s += (30 - e) * 3 * (pc - oc);
    return s;
  }

  // ---- transposition tables ----
  function makeTT(bits) {
    const n = 1 << bits;
    return {
      mask: n - 1, k0: new Int32Array(n), k1: new Int32Array(n), k2: new Int32Array(n), k3: new Int32Array(n),
      val: new Int32Array(n), dep: new Int8Array(n), flag: new Int8Array(n), mv: new Int8Array(n)
    };
  }
  function hidx(T, pl, ph, ol, oh) {
    let h = Math.imul(pl, 0x9E3779B1) ^ Math.imul(ph, 0x85EBCA6B) ^ Math.imul(ol, 0xC2B2AE35) ^ Math.imul(oh, 0x27D4EB2F);
    h ^= h >>> 15; h = Math.imul(h, 0x2C1B3C6D); h ^= h >>> 13;
    return h & T.mask;
  }
  function ttPut(T, i, pl, ph, ol, oh, depth, val, flag, mv) {
    T.k0[i] = pl; T.k1[i] = ph; T.k2[i] = ol; T.k3[i] = oh;
    T.val[i] = val; T.dep[i] = depth; T.flag[i] = flag; T.mv[i] = mv;
  }
  const TTM = makeTT(midBits || 18), TTS = makeTT(solveBits || 17);
  function reset() { TTM.flag.fill(0); TTS.flag.fill(0); }

  // ---- move lists per ply ----
  const MAXP = 90;
  const mvSq = [], mvFL = [], mvFH = [], mvSc = [];
  for (let i = 0; i < MAXP; i++) {
    mvSq.push(new Int8Array(40)); mvFL.push(new Int32Array(40)); mvFH.push(new Int32Array(40)); mvSc.push(new Int32Array(40));
  }
  const WT = [
    100, -20, 10, 5, 5, 10, -20, 100,
    -20, -50, -2, -2, -2, -2, -50, -20,
    10, -2, 1, 1, 1, 1, -2, 10,
    5, -2, 1, 0, 0, 1, -2, 5,
    5, -2, 1, 0, 0, 1, -2, 5,
    10, -2, 1, 1, 1, 1, -2, 10,
    -20, -50, -2, -2, -2, -2, -50, -20,
    100, -20, 10, 5, 5, 10, -20, 100
  ];

  // Generates the move list for ply into mvSq etc. mode: 0 plain bit order, 1 static weights, 2 fast-first (opp mobility)
  function genMoves(pl, ph, ol, oh, ml, mh, ply, mode, ttMove) {
    const sq = mvSq[ply], fl = mvFL[ply], fh = mvFH[ply], sc = mvSc[ply];
    let n = 0;
    for (let half = 0; half < 2; half++) {
      let t = half === 0 ? ml : mh;
      while (t !== 0) {
        const b = t & -t; t ^= b;
        const s = (half === 0 ? 31 : 63) - Math.clz32(b);
        flips(pl, ph, ol, oh, s);
        const f0 = FL, f1 = FH;
        sq[n] = s; fl[n] = f0; fh[n] = f1;
        let v = 0;
        if (s === ttMove) v = 100000000;
        else if (mode === 2) {
          const bL = s < 32 ? (1 << s) : 0, bH = s >= 32 ? (1 << (s - 32)) : 0;
          moves(ol & ~f0, oh & ~f1, pl | f0 | bL, ph | f1 | bH);
          v = -(pop(ML) + pop(MH)) * 100 + WT[s] * 4;
          if (s === 0 || s === 7 || s === 56 || s === 63) v += 3000;
        } else if (mode === 1) v = WT[s];
        sc[n] = v;
        n++;
      }
    }
    return n;
  }

  function selectBest(ply, k, n) {
    const sq = mvSq[ply], fl = mvFL[ply], fh = mvFH[ply], sc = mvSc[ply];
    let bi = k;
    for (let j = k + 1; j < n; j++) if (sc[j] > sc[bi]) bi = j;
    if (bi !== k) {
      let t = sq[k]; sq[k] = sq[bi]; sq[bi] = t;
      t = fl[k]; fl[k] = fl[bi]; fl[bi] = t;
      t = fh[k]; fh[k] = fh[bi]; fh[bi] = t;
      t = sc[k]; sc[k] = sc[bi]; sc[bi] = t;
    }
  }

  // ---- midgame alpha-beta (negamax, PVS, TT) ----
  function ab(pl, ph, ol, oh, depth, alpha, beta, ply) {
    if ((++nodes & 2047) === 0 && perf() > deadline) throw ABORT;

  // opt: {timed, timeMs, depth, endN, noise}

    const t0 = perf();

    movesOf: function (pl, ph, ol, oh) { moves(pl, ph, ol, oh); return [ML, MH]; },

<script>
(function () {

    var c = counts(cur), ai = 1 - human, names = ["黒", "白"];
    if (cur.over) {
      var h = c[human], a = c[ai];
      var r = h > a ? "あなたの勝ちです" : (h < a ? "AIの勝ちです" : "引き分けです");
      return "対局終了。黒 " + c[0] + " ― 白 " + c[1] + "。" + r;
    }
    var pre = "";
    if (cur.passBy === ai) pre = "AIは打てる場所がなくパスしました。";
    else if (cur.passBy === human) pre = "あなたは打てる場所がないためパスです。";
    if (cur.side === human) return pre + "あなたの番です（" + names[human] + "）";
    return pre + "AI（" + names[ai] + "）が考えています…";
  }

  function render() {
    var legalM = [0, 0];
    var showHint = !thinking && !cur.over && cur.side === human;
    if (showHint) legalM = legal(cur);
    for (var i = 0; i < 64; i++) {
      var col = bit(cur.bl, cur.bh, i) ? "b" : (bit(cur.wl, cur.wh, i) ? "w" : "");
      if (discs[i].dataset.c !== col) discs[i].dataset.c = col;
      cells[i].classList.toggle("last", i === cur.mv);
      cells[i].classList.toggle("hint", showHint && hints && !!bit(legalM[0], legalM[1], i));
    }
    var c = counts(cur);
    $("nB").textContent = c[0]; $("nW").textContent = c[1];
    $("whoB").textContent = human === 0 ? "あなた" : "AI";
    $("whoW").textContent = human === 1 ? "あなた" : "AI";
    $("plB").classList.toggle("turn", !cur.over && cur.side === 0);
    $("plW").classList.toggle("turn", !cur.over && cur.side === 1);
    $("status").textContent = statusText();
    var parts = [];
    for (var k = 1; k < hist.length; k++) {
      var st = hist[k];
      parts.push((st.by === 0 ? "●" : "○") + coord(st.mv));
      if (st.passBy !== null) parts.push((st.passBy === 0 ? "●" : "○") + "パス");
    }
    var kp = $("kifu"), was = kp.scrollTop;
    kp.textContent = parts.length ? parts.join(" ") : "—";
    kp.scrollTop = kp.scrollHeight;
    $("undoBtn").disabled = !canUndo();
  }

  function undoTarget() {
    for (var k = hist.length - 2; k >= 0; k--) if (hist[k].side === human && !hist[k].over) return k;
    return -1;
  }
  function canUndo() { return undoTarget() >= 0; }
  function undo() {
    var j = undoTarget();
    if (j < 0) return;
    cancelAI();
    hist.length = j + 1; cur = hist[j];
    $("aiinfo").textContent = LEVELS[level].desc;
    render();
  }

  function newGame() {
    cancelAI();
    human = pendingHuman;
    var st = initState();
    hist = [st]; cur = st;
    $("evalbar").style.setProperty("--p", "50%"); $("evalcap").textContent = "AIの形勢";
    $("aiinfo").textContent = LEVELS[level].desc;
    render();
    if (cur.side !== human) aiTurn();
  }

  // controls
  var seg = $("levelSeg");
  LEVELS.forEach(function (lv, idx) {
    var b = document.createElement("button");
    b.type = "button"; b.setAttribute("aria-pressed", idx === level ? "true" : "false");
    b.innerHTML = lv.name + "<small>" + lv.sub + "</small>";
    b.addEventListener("click", function () {
      level = idx;
      Array.prototype.forEach.call(seg.children, function (x, j) { x.setAttribute("aria-pressed", j === idx ? "true" : "false"); });
      if (!thinking) $("aiinfo").textContent = LEVELS[level].desc;
    });
    seg.appendChild(b);
  });
  function setSide(v) {
    pendingHuman = v;
    $("sideB").setAttribute("aria-pressed", v === 0 ? "true" : "false");
    $("sideW").setAttribute("aria-pressed", v === 1 ? "true" : "false");
  }
  $("sideB").addEventListener("click", function () { setSide(0); });
  $("sideW").addEventListener("click", function () { setSide(1); });
  $("newBtn").addEventListener("click", newGame);
  $("undoBtn").addEventListener("click", undo);
  $("hintBtn").addEventListener("click", function () {
    hints = !hints; this.setAttribute("aria-pressed", hints ? "true" : "false"); render();
  });

  newGame();
})();
</script>

</body></html>
