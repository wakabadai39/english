<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>単語帳（A1・A2・B1統合／全1,035語・完成）</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');

  :root{
    --bg: #e9e9e6;
    --bg-deep: #dcdcd8;
    --ink: #2b2b2b;
    --ink-soft: #6b6b68;
    --line: #c7c7c2;
    --card: #f4f3ef;
    --accent: #b3422e;
    --accent-soft: #d98f7e;
    --done: #7c8a6e;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(0,0,0,0.02) 0%, transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(0,0,0,0.02) 0%, transparent 40%);
    color: var(--ink);
    font-family: 'Inter', 'Noto Sans JP', sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 28px 16px 60px;
  }

  .topbar{
    width:100%;
    max-width:480px;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom: 6px;
  }

  .title{
    font-family:'Spectral', serif;
    font-weight:600;
    font-size: 1.5rem;
    letter-spacing: 0.01em;
  }
  .title .accent{ color: var(--accent); font-style: italic; }

  .progress-label{
    font-size: 0.78rem;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
    text-align:right;
  }

  .progress-track{
    width:100%;
    max-width:480px;
    height: 3px;
    background: var(--line);
    border-radius: 2px;
    margin: 10px 0 28px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background: var(--accent);
    transition: width 0.4s ease;
  }

  .stage{
    width:100%;
    max-width:480px;
    position:relative;
    height: 340px;
    perspective: 1200px;
  }

  .card{
    position:absolute;
    inset:0;
    border-radius: 14px;
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 12px 28px -16px rgba(0,0,0,0.18);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding: 28px 26px;
    cursor:pointer;
    transition: transform 0.45s cubic-bezier(.22,.61,.36,1), opacity 0.3s ease, box-shadow 0.3s;
    backface-visibility:hidden;
    user-select:none;
  }

  .card.behind{
    transform: scale(0.96) translateY(10px);
    box-shadow: none;
    z-index: 0;
    opacity: 0.6;
  }

  .card.front{ z-index: 1; }

  .card.flipping{
    transform: rotateY(90deg) scale(0.96);
    opacity: 0;
  }

  .card.exit-left{
    transform: translateX(-130%) rotate(-8deg);
    opacity: 0;
  }

  .eyebrow{
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 18px;
  }

  .word{
    font-family:'Spectral', serif;
    font-weight: 600;
    font-size: 1.7rem;
    line-height: 1.15;
    margin: 0 0 18px;
    white-space: nowrap;
    overflow: hidden;
    max-width: 100%;
  }

  .speak-btn{
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: #fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition: background 0.2s, transform 0.15s, border-color 0.2s;
    flex-shrink:0;
  }
  .speak-btn:hover{ border-color: var(--accent-soft); }
  .speak-btn:active{ transform: scale(0.92); }
  .speak-btn svg{ width:20px; height:20px; fill: var(--accent); }
  .speak-btn.speaking svg{ animation: pulse 0.6s ease infinite alternate; }
  .speak-btn.looping{ background: var(--accent); border-color: var(--accent); }
  .speak-btn.looping svg{ fill: #fff; animation: pulse 0.6s ease infinite alternate; }
  @keyframes pulse{ from{ opacity:1; } to{ opacity:0.45; } }

  .word-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 14px;
    margin-bottom: 6px;
  }

  .tap-hint{
    font-size: 0.78rem;
    color: var(--ink-soft);
    margin-top: 16px;
  }

  .hint-block{
    width:100%;
  }
  .word-back-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:16px;
    padding-bottom:14px;
    border-bottom:1px solid var(--line);
  }
  .word-back{
    font-family:'Spectral', serif;
    font-weight:600;
    font-size:1.35rem;
    line-height:1.2;
  }
  .hint-label{
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
  }
  .hint-text{
    font-size: 1.15rem;
    font-weight: 500;
    margin-bottom: 22px;
    line-height: 1.6;
  }
  .example-label{
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }
  .example-text{
    font-family:'Spectral', serif;
    font-style: italic;
    font-size: 1.05rem;
    line-height: 1.6;
    color: var(--ink);
  }

  .controls{
    width:100%;
    max-width:480px;
    display:flex;
    gap: 12px;
    margin-top: 26px;
  }

  .btn{
    flex:1;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    font-family:'Inter', sans-serif;
    font-size: 0.95rem;
    font-weight: 500;
    padding: 14px 16px;
    border-radius: 10px;
    cursor:pointer;
    transition: background 0.2s, border-color 0.2s, transform 0.1s;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 8px;
  }
  .btn:active{ transform: scale(0.98); }
  .btn.skip:hover{ border-color: var(--ink-soft); }

  .btn.master{
    background: var(--done);
    color: #fff;
    border-color: var(--done);
  }
  .btn.master:hover{ background: #6c7a5e; }

  .controls-secondary{
    width:100%;
    max-width:480px;
    display:flex;
    gap: 12px;
    margin-top: 10px;
  }
  .btn-small{
    flex:1;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink-soft);
    font-family:'Inter', sans-serif;
    font-size: 0.82rem;
    font-weight: 500;
    padding: 9px 12px;
    border-radius: 8px;
    cursor:pointer;
    transition: background 0.2s, border-color 0.2s, color 0.2s, transform 0.1s;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 6px;
  }
  .btn-small:active{ transform: scale(0.98); }
  .btn-small:hover{ border-color: var(--accent-soft); color: var(--accent); }
  .btn-small:disabled{
    opacity: 0.4;
    cursor: default;
  }
  .btn-small:disabled:hover{ border-color: var(--line); color: var(--ink-soft); }

  .position-label{
    font-size: 0.78rem;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
    text-align:center;
    margin-top: 12px;
  }

  .empty-state{
    width:100%;
    max-width:480px;
    height: 340px;
    border-radius:14px;
    border: 1px dashed var(--line);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 30px;
    gap: 14px;
  }
  .empty-state .word{ font-size: 1.6rem; }
  .empty-state p{
    color: var(--ink-soft);
    font-size: 0.92rem;
    line-height: 1.7;
    margin:0;
  }

  .footer-row{
    width:100%;
    max-width:480px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top: 30px;
    font-size: 0.78rem;
    color: var(--ink-soft);
  }

  .reset-link{
    color: var(--ink-soft);
    text-decoration: underline;
    text-decoration-color: var(--line);
    cursor:pointer;
    background:none;
    border:none;
    font-family:inherit;
    font-size: inherit;
    padding:0;
  }
  .reset-link:hover{ color: var(--accent); }

  .checkmark-flash{
    position:absolute;
    top: 16px;
    right: 16px;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--done);
    opacity:0;
    transition: opacity 0.3s;
  }
  .checkmark-flash.show{ opacity:1; }

  @media (max-width: 380px){
    .word{ font-size: 1.4rem; }
    .stage{ height: 320px; }
  }

  .card.flipped-card{
    padding: 24px 24px;
    overflow-y: auto;
    align-items: stretch;
    text-align: left;
  }

  .back-scroll{
    width:100%;
    overflow-y: auto;
    max-height: 100%;
    padding-right: 4px;
  }

  .general-block{
    background: var(--bg-deep);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 16px;
  }
  .general-label{
    font-size: 0.68rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .general-text{
    font-size: 0.92rem;
    line-height: 1.6;
    color: var(--ink);
  }

  .example-ja-text{
    font-size: 0.9rem;
    line-height: 1.6;
    color: var(--ink-soft);
    margin-top: 6px;
  }

  .note-block{
    margin-top: 18px;
    border-top: 1px dashed var(--line);
    padding-top: 14px;
  }
  .note-label{
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .note-text{
    font-size: 0.9rem;
    line-height: 1.7;
    color: var(--ink);
  }

  .back-tap-hint{
    text-align:center;
    margin-top: 18px;
  }

  .panel-toggle{
    width:100%;
    max-width:480px;
    display:flex;
    justify-content:flex-end;
    margin-top: 10px;
  }
  .mastered-panel{
    width:100%;
    max-width:480px;
    margin-top: 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--card);
    padding: 16px;
    display:none;
  }
  .mastered-panel.open{ display:block; }
  .mastered-panel h3{
    font-family:'Spectral', serif;
    font-size: 1.05rem;
    font-weight: 600;
    margin: 0 0 12px;
  }
  .mastered-list{
    list-style:none;
    margin:0;
    padding:0;
    max-height: 280px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap: 6px;
  }
  .mastered-list li{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 10px;
    padding: 8px 10px;
    background: var(--bg-deep);
    border-radius: 8px;
    font-size: 0.92rem;
  }
  .mastered-list li .m-word{
    font-family:'Spectral', serif;
    font-weight: 500;
  }
  .restore-btn{
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    font-size: 0.78rem;
    padding: 6px 10px;
    border-radius: 8px;
    cursor:pointer;
    flex-shrink:0;
    white-space: nowrap;
  }
  .restore-btn:hover{ border-color: var(--accent-soft); color: var(--accent); }
  .mastered-empty{
    color: var(--ink-soft);
    font-size: 0.88rem;
    text-align:center;
    padding: 10px 0;
  }

  .stats-row{
    width:100%;
    max-width:480px;
    display:flex;
    justify-content:space-between;
    font-size: 0.76rem;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }
  .source-select-row{
    width:100%;
    max-width:480px;
    margin-bottom: 16px;
  }
  #sourceFilter{
    width:100%;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    font-family:'Inter', sans-serif;
    font-size: 0.85rem;
  }
  .source-tag{
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    background: var(--bg-deep);
    padding: 3px 9px;
    border-radius: 10px;
    display:inline-block;
    margin-bottom: 14px;
  }
  .box-badge{
    position:absolute;
    top: 16px;
    left: 16px;
    font-size: 0.68rem;
    color: var(--ink-soft);
    background: var(--bg-deep);
    padding: 3px 8px;
    border-radius: 8px;
  }
  .master-checkbox-row{
    position:absolute;
    top: 16px;
    right: 16px;
    display:flex;
    align-items:center;
    gap: 5px;
    font-size: 0.7rem;
    color: var(--ink-soft);
    cursor:pointer;
  }
  .master-checkbox-row input[type=checkbox]{
    width: 16px;
    height: 16px;
    accent-color: var(--done);
    cursor:pointer;
  }
  .review-date{
    font-size: 0.72rem;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .review-mode-row{
    width:100%;
    max-width:480px;
    display:flex;
    gap: 8px;
    margin-top: 10px;
    align-items:center;
  }
  .review-mode-row #reviewToggleBtn{ flex: 1; }
  .review-mode-row #reviewFilterSelect{
    flex: 1.2;
    padding: 9px 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    font-family:'Inter', sans-serif;
    font-size: 0.8rem;
  }
  .btn-small.btn-on{
    background: var(--done);
    border-color: var(--done);
    color: #fff;
  }
  .review-banner{
    width:100%;
    max-width:480px;
    text-align:center;
    font-size: 0.78rem;
    color: var(--done);
    background: #eef3ea;
    border-radius: 8px;
    padding: 6px 10px;
    margin-top: 10px;
    display:none;
  }
  .review-banner.show{ display:block; }
  .example-en{ cursor: pointer; }
  .master-checkbox-row.on-back{
    top: 16px;
    right: 16px;
    background: var(--bg-deep);
    padding: 4px 9px;
    border-radius: 20px;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="title">単語帳 <span class="accent">A1-A2-B1</span></div>
  <div class="progress-label" id="progressLabel">0 / 0 習得</div>
</div>

<div class="progress-track">
  <div class="progress-fill" id="progressFill" style="width:0%"></div>
</div>

<div class="stats-row" id="statsRow">
  <span id="dueLabel">本日の新規・復習: 0語</span>
  <span id="totalLabel">全カード: 0語</span>
</div>

<div class="source-select-row">
  <select id="sourceFilter"></select>
</div>

<div class="stage" id="stage"></div>

<div class="controls" id="controls">
  <button class="btn skip" id="skipBtn">次へ (まだ)</button>
  <button class="btn master" id="masterBtn">習得済み ✓</button>
</div>

<div class="controls-secondary" id="controlsSecondary">
  <button class="btn-small" id="prevBtn">← 一つ前に戻る</button>
  <button class="btn-small" id="restartBtn">⟲ 最初に戻る</button>
</div>

<div class="controls-secondary" id="randomRow" style="margin-top:8px;">
  <button class="btn-small" id="randomToggleBtn">🔀 ランダム出題: OFF</button>
</div>

<div class="review-mode-row">
  <button class="btn-small" id="reviewToggleBtn">🔁 これまでの単語を復習する</button>
  <select id="reviewFilterSelect">
    <option value="due" selected>本日復習（出題対象のみ）</option>
    <option value="b1">1日サイクル</option>
    <option value="b2">3日サイクル</option>
    <option value="b3">7日サイクル</option>
    <option value="b4">14日サイクル</option>
    <option value="b5">30日サイクル</option>
    <option value="b6">60日サイクル</option>
    <option value="b7">90日サイクル</option>
    <option value="all">すべて</option>
  </select>
</div>

<div class="review-banner" id="reviewBanner">🔁 復習モード中：これまでに「習得済み ✓」にした単語をまとめて出題しています</div>

<div class="position-label" id="positionLabel"></div>

<div class="footer-row">
  <span id="remainingLabel"></span>
  <button class="reset-link" id="resetBtn">すべてリセット</button>
</div>

<script>
const WORDS = [
{"word":"abbreviation","general":"略語","example":"The report used 'ASAP' as an abbreviation for 'as soon as possible.'","example_ja":"その報告書は「as soon as possible」の略語として「ASAP」を使った。","source":"B1: 学校・言葉"},
{"word":"ablest","general":"最も有能な（ableの最上級）","example":"She was seen as the ablest manager the company ever had.","example_ja":"彼女はその会社がこれまで持った中で最も有能な管理者だと見なされていた。","source":"B1: 仕事・社会"},
{"word":"ably","general":"巧みに、上手に","example":"He ably answered every question the reporters asked.","example_ja":"彼は記者たちが尋ねるあらゆる質問に巧みに答えた。","source":"B1: 仕事・社会"},
{"word":"accuse","general":"非難する、告発する","example":"She refused to accuse anyone without proof.","example_ja":"彼女は証拠なしに誰かを告発することを拒んだ。","source":"B1: 仕事・社会"},
{"word":"acne","general":"ニキビ","example":"Stress can sometimes make acne worse.","example_ja":"ストレスがニキビを悪化させることがある。","source":"B1: 家庭・くらし"},
{"word":"adorable","general":"とてもかわいい","example":"The kitten looked adorable asleep in the basket.","example_ja":"その子猫はかごの中で眠っていて、とてもかわいらしく見えた。","source":"B1: 動物・自然"},
{"word":"advert","general":"広告（英）","example":"A catchy advert for the new phone played before the movie.","example_ja":"映画の前に、新しい携帯電話の耳に残る広告が流れた。","source":"B1: 仕事・社会"},
{"word":"algebra","general":"代数","example":"He struggled with algebra at first.","example_ja":"彼は最初、代数に苦労していた。","source":"B1: 学校・言葉"},
{"word":"annoyance","general":"いらだち","example":"To his annoyance, the meeting started late.","example_ja":"いらだたしいことに、会議は遅れて始まった。","source":"B1: 家庭・くらし"},
{"word":"annoying","general":"イライラさせる","example":"That dripping faucet is really annoying at night.","example_ja":"あの水滴が落ちる蛇口は夜には本当にイライラさせる。","source":"B1: 家庭・くらし"},
{"word":"apostrophe","general":"アポストロフィー（'）","example":"He forgot the apostrophe in 'it's' again.","example_ja":"彼はまた「it's」のアポストロフィーを忘れた。","source":"B1: 学校・言葉"},

{"word":"archer","general":"射手、アーチェリー選手","example":"The archer released the arrow calmly.","example_ja":"その射手は落ち着いて矢を放った。","source":"B1: 仕事・社会"},
{"word":"arithmetic","general":"算数","example":"Basic arithmetic is taught in early school years.","example_ja":"基本的な算数は学校の早い学年で教えられる。","source":"B1: 学校・言葉"},
{"word":"asst","general":"assistant（アシスタント）の略記","example":"Please cc my asst. on future emails.","example_ja":"今後のメールは私のアシスタントにもccしてください。","source":"B1: 仕事・社会"},
{"word":"astray","general":"道に迷って","example":"The confusing map led the hikers astray.","example_ja":"わかりにくい地図がそのハイカーたちを道に迷わせた。","source":"B1: 家庭・くらし"},
{"word":"astrology","general":"占星術","example":"She reads her astrology forecast every morning.","example_ja":"彼女は毎朝、占星術の占いを読んでいる。","source":"B1: 家庭・くらし"},
{"word":"asylum","general":"（政治的）亡命、保護","example":"The family sought asylum in a new country.","example_ja":"その家族は新しい国で亡命を求めた。","source":"B1: 仕事・社会"},
{"word":"atheist","general":"無神論者","example":"He describes himself as an atheist.","example_ja":"彼は自分を無神論者だと表現している。","source":"B1: 仕事・社会"},
{"word":"atlas","general":"地図帳","example":"The old atlas still showed countries that no longer exist.","example_ja":"その古い地図帳には、もう存在しない国々がまだ載っていた。","source":"B1: 学校・言葉"},

const STORAGE_KEY = 'vocab-master-progress';
WORDS.forEach((w, i) => { w.idx = i; });

const BOX_INTERVALS_DAYS = [1, 3, 7, 14, 30, 60, 90];
const MAX_BOX = 7;

function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function addDays(dateStr, days){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

let progress = {};
try{
  progress = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
}catch(e){ progress = {}; }

let currentSource = 'ALL';
let isRandom = false;
function shuffleArray(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
let reviewMode = false;
let reviewFilter = 'due';
let reviewIndex = 0;
let reviewConfirmed = new Set();
let deck = [];
let originalOrder = [];
let history = [];
let flipped = false;
let loopingWord = null;

function saveProgress(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
  }catch(e){}
}

function getState(idx){
  return progress[idx] || { box: 0, nextReview: todayStr() };
}

function sourceFilteredWords(){
  if(currentSource === 'ALL') return WORDS;
  return WORDS.filter(w => w.source === currentSource);
}

function isDue(idx){
  const st = getState(idx);
  return st.box === 0 || st.nextReview <= todayStr();
}

function buildDeck(){
  const pool = sourceFilteredWords();
  if(reviewMode){
    const learned = pool.filter(w => getState(w.idx).box >= 1);
    let filtered;
    if(reviewFilter === 'all'){
      filtered = learned;
    } else if(reviewFilter === 'due'){
      filtered = learned.filter(w => isDue(w.idx));
    } else {
      const wantBox = parseInt(reviewFilter.slice(1), 10);
      filtered = learned.filter(w => getState(w.idx).box === wantBox);
    }
    filtered.sort((a, b) => getState(a.idx).nextReview.localeCompare(getState(b.idx).nextReview));
    deck = filtered;
    if(isRandom) shuffleArray(deck);
  } else {
    deck = pool.filter(w => isDue(w.idx));
    if(isRandom) shuffleArray(deck);
  }
  originalOrder = deck.slice();
  history = [];
}

function renderSourceFilter(){
  const sel = document.getElementById('sourceFilter');
  const sources = Array.from(new Set(WORDS.map(w => w.source)));
  sel.innerHTML = '';
  const optAll = document.createElement('option');
  optAll.value = 'ALL';
  optAll.textContent = 'すべてのカテゴリ（' + WORDS.length + '語）';
  sel.appendChild(optAll);
  sources.forEach(s => {
    const count = WORDS.filter(w => w.source === s).length;
    const opt = document.createElement('option');
    opt.value = s;
    opt.textContent = s + '（' + count + '語）';
    sel.appendChild(opt);
  });
  sel.addEventListener('change', () => {
    currentSource = sel.value;
    buildDeck();
    render();
  });
}

function speakOnce(word, onEnd){
  const utter = new SpeechSynthesisUtterance(word);
  utter.lang = 'en-US';
  utter.rate = 0.85;
  utter.onend = onEnd;
  utter.onerror = onEnd;
  window.speechSynthesis.speak(utter);
}

function startLoop(word){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  loopingWord = word;
  const btn = document.querySelector('.speak-btn');
  if(btn) btn.classList.add('looping');

  const playNext = () => {
    if(loopingWord !== word) return;
    speakOnce(word, () => {
      if(loopingWord !== word) return;
      setTimeout(() => {
        if(loopingWord === word) playNext();
      }, 500);
    });
  };
  playNext();
}

function stopLoop(){
  loopingWord = null;
  window.speechSynthesis.cancel();
  const btn = document.querySelector('.speak-btn');
  if(btn) btn.classList.remove('looping');
}

function updateProgress(){
  const total = WORDS.length;
  const learnedAtLeastOnce = WORDS.filter(w => getState(w.idx).box >= 1).length;
  const masteredCount = WORDS.filter(w => getState(w.idx).box >= MAX_BOX).length;
  const pool = sourceFilteredWords();
  const dueCount = pool.filter(w => isDue(w.idx)).length;

  document.getElementById('progressLabel').textContent = `${masteredCount} / ${total} 定着`;
  document.getElementById('progressFill').style.width = `${(learnedAtLeastOnce/total)*100}%`;
  document.getElementById('dueLabel').textContent = reviewMode
    ? `復習対象: ${deck.length}語`
    : `本日の新規・復習: ${dueCount}語`;
  document.getElementById('totalLabel').textContent = `全カード: ${total}語`;

  const remaining = deck.length;
  document.getElementById('remainingLabel').textContent = remaining > 0 ? `残り ${remaining} 語` : '';

  const positionLabel = document.getElementById('positionLabel');
  const prevBtn = document.getElementById('prevBtn');
  const restartBtn = document.getElementById('restartBtn');
  const curForLabel = reviewMode ? deck[reviewIndex] : deck[0];
  if(remaining > 0 && originalOrder.length > 0 && curForLabel){
    const posIdx = originalOrder.findIndex(w => w.idx === curForLabel.idx);
    const displayIdx = posIdx >= 0 ? posIdx + 1 : '?';
    positionLabel.textContent = `${displayIdx} / ${originalOrder.length} 枚目`;
  } else {
    positionLabel.textContent = '';
  }
  if(prevBtn) prevBtn.disabled = history.length === 0;
  if(restartBtn) restartBtn.disabled = originalOrder.length === 0;
}

function boxLabel(idx){
  const st = getState(idx);
  if(st.box >= MAX_BOX) return '定着済み';
  if(st.box === 0) return '新規';
  return `Box ${st.box}`;
}

function fitWordFont(){
  const wordEl = document.querySelector('#currentCard .word');
  const row = document.querySelector('#currentCard .word-row');
  if(!wordEl || !row) return;
  const speakBtn = row.querySelector('.speak-btn');
  const reserve = speakBtn ? speakBtn.offsetWidth + 18 : 0;
  const available = row.clientWidth - reserve - 4;
  let size = 30;
  const minSize = 14;
  wordEl.style.whiteSpace = 'nowrap';
  wordEl.style.display = 'inline-block';
  wordEl.style.fontSize = size + 'px';
  while(wordEl.scrollWidth > available && size > minSize){
    size -= 1;
    wordEl.style.fontSize = size + 'px';
  }
}

function frontHTML(current){
  const st = getState(current.idx);
  const isMastered = st.box >= 1;
  return `
    <span class="source-tag">${current.source}</span>
    <div class="box-badge">${boxLabel(current.idx)}</div>
    ${!reviewMode ? `
    <label class="master-checkbox-row">
      <input type="checkbox" id="masterCbFront" ${isMastered ? 'checked' : ''}>
      <span>マスター</span>
    </label>` : ''}
    <div class="eyebrow">タップして意味を見る</div>
    <div class="word-row">
      <div class="word">${current.word}</div>
      <button class="speak-btn" id="speakBtn" title="発音を聞く">${speakerIcon()}</button>
    </div>
    <div class="tap-hint">単語をタップ / クリック</div>
  `;
}

function backHTML(current){
  const st = getState(current.idx);
  const isMastered = st.box >= 1;
  return `
    ${!reviewMode ? `
    <label class="master-checkbox-row on-back">
      <input type="checkbox" id="masterCbBack" ${isMastered ? 'checked' : ''}>
      <span>マスター</span>
    </label>` : ''}
    <div class="back-scroll">
      <div class="word-back-row">
        <div class="word-back">${current.word}</div>
        <button class="speak-btn" id="speakBtn" title="発音を聞く">${speakerIcon()}</button>
      </div>
      <div class="hint-block">
        <div class="hint-label">意味</div>
        <div class="hint-text">${current.general}</div>
        <div class="general-block">
          <div class="general-label">EXAMPLE（タップで読み上げ）</div>
          <div class="general-text example-en" id="exampleSentence">${current.example}</div>
          <div class="example-ja-text">${current.example_ja}</div>
        </div>
      </div>
      <div class="back-tap-hint tap-hint">タップで単語に戻る</div>
    </div>
  `;
}

function attachSpeakHandler(current){
  const speakBtn = document.getElementById('speakBtn');
  if(speakBtn){
    speakBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if(loopingWord === current.word){
        stopLoop();
      } else {
        startLoop(current.word);
      }
    });
  }
  const exampleEl = document.getElementById('exampleSentence');
  if(exampleEl){
    exampleEl.addEventListener('click', (e) => {
      e.stopPropagation();
      speakOnce(current.example, () => {});
    });
  }
  ['masterCbFront', 'masterCbBack'].forEach(id => {
    const masterCb = document.getElementById(id);
    if(masterCb){
      masterCb.addEventListener('click', (e) => e.stopPropagation());
      masterCb.addEventListener('change', (e) => {
        if(reviewMode) return;
        nextCard(e.target.checked);
      });
    }
  });
}

function currentCard(){
  if(reviewMode){
    if(deck.length === 0) return null;
    if(reviewIndex >= deck.length) reviewIndex = 0;
    return deck[reviewIndex];
  }
  return deck[0] || null;
}

function render(){
  stopLoop();
  const stage = document.getElementById('stage');
  const controls = document.getElementById('controls');
  const skipBtn = document.getElementById('skipBtn');
  const masterBtn = document.getElementById('masterBtn');
  const controlsSecondary = document.getElementById('controlsSecondary');

  if(reviewMode){
    skipBtn.textContent = '次へ（スキップ）';
    masterBtn.textContent = '✓ 覚えている（復習完了）';
    masterBtn.style.display = '';
    controlsSecondary.style.display = 'none';
  } else {
    skipBtn.textContent = '次へ（まだ）';
    masterBtn.style.display = 'none';
  }

  const current = currentCard();

  if(!current){
    stage.innerHTML = `
      <div class="empty-state">
        <div class="word">${reviewMode ? '復習する単語がありません' : 'よくできました'}</div>
        <p>${reviewMode
          ? (reviewFilter === 'due'
              ? '今日、復習日を迎えている単語は今のところありません。<br>上のプルダウンで「すべて」に切り替えると、日付に関係なくこれまでマスターした単語をまとめて確認できます。'
              : reviewFilter === 'all'
                ? 'まだ一度も「マスター」にチェックを入れた単語がありません。<br>通常モードで単語を学習すると、ここに復習対象として表示されます。'
                : 'このサイクルに該当する単語は今のところありません。')
          : '本日の新規学習・復習はこれで終わりです。<br>「🔁 これまでの単語を復習する」で、今までマスターした単語をまとめて確認できます。'}</p>
      </div>
    `;
    controls.style.display = 'none';
    controlsSecondary.style.display = 'none';
    updateProgress();
    return;
  }

  controls.style.display = 'flex';
  if(!reviewMode) controlsSecondary.style.display = 'flex';
  flipped = false;

  const nextPeek = reviewMode ? null : deck[1];

  stage.innerHTML = `
    ${nextPeek ? `<div class="card behind"></div>` : ''}
    <div class="card front" id="currentCard">
      ${frontHTML(current)}
    </div>
  `;

  document.getElementById('currentCard').addEventListener('click', (e) => {
    if(e.target.closest('.speak-btn')) return;
    if(e.target.closest('.master-checkbox-row')) return;
    flipCard();
  });

  attachSpeakHandler(current);
  requestAnimationFrame(fitWordFont);

  updateProgress();
}

function flipCard(){
  if(flipped) {
    showFront();
    return;
  }
  stopLoop();
  const card = document.getElementById('currentCard');
  const current = currentCard();
  if(!current) return;
  flipped = true;

  card.classList.add('flipping');
  setTimeout(() => {
    card.classList.add('flipped-card');
    card.innerHTML = backHTML(current);
    attachSpeakHandler(current);
    card.classList.remove('flipping');
  }, 220);
}

function showFront(){
  const card = document.getElementById('currentCard');
  const current = currentCard();
  if(!current) return;
  flipped = false;
  card.classList.add('flipping');
  setTimeout(() => {
    card.classList.remove('flipped-card');
    card.innerHTML = frontHTML(current);
    attachSpeakHandler(current);
    requestAnimationFrame(fitWordFont);
    card.classList.remove('flipping');
  }, 220);
}

function nextCard(gotIt){
  const card = document.getElementById('currentCard');
  if(!card){ return; }

  const current = deck[0];
  const prevState = Object.assign({}, getState(current.idx));

  history.push({
    idx: current.idx,
    gotIt: gotIt,
    prevState: prevState
  });

  const st = getState(current.idx);
  if(gotIt){
    if(st.box === 0){ st.origin = todayStr(); }
    const prevBox = st.box;
    st.box = Math.min(MAX_BOX, st.box + 1);
    if(prevBox < MAX_BOX){
      st.nextReview = addDays(st.origin, BOX_INTERVALS_DAYS[st.box - 1]);
    } else {
      st.nextReview = addDays(todayStr(), BOX_INTERVALS_DAYS[BOX_INTERVALS_DAYS.length - 1]);
    }
  } else {
    st.box = 0;
    st.origin = null;
    st.nextReview = todayStr();
  }
  progress[current.idx] = st;
  saveProgress();

  card.classList.add('exit-left');

  setTimeout(() => {
    deck.shift();
    render();
  }, 260);
}

function prevCard(){
  if(history.length === 0) return;
  const last = history.pop();

  progress[last.idx] = last.prevState;
  saveProgress();

  const w = WORDS[last.idx];
  if(w) deck.unshift(w);

  render();
}

function reviewNext(){
  if(deck.length === 0) return;
  reviewIndex = (reviewIndex + 1) % deck.length;
  render();
}

function reviewPrev(){
  if(deck.length === 0) return;
  reviewIndex = (reviewIndex - 1 + deck.length) % deck.length;
  render();
}

function confirmReview(){
  const current = currentCard();
  if(!current) return;
  if(reviewConfirmed.has(current.idx)) return;
  reviewConfirmed.add(current.idx);
  const st = getState(current.idx);
  const prevBox = st.box;
  st.box = Math.min(MAX_BOX, st.box + 1);
  if(prevBox < MAX_BOX){
    st.nextReview = addDays(st.origin || todayStr(), BOX_INTERVALS_DAYS[st.box - 1]);
  } else {
    st.nextReview = addDays(todayStr(), BOX_INTERVALS_DAYS[BOX_INTERVALS_DAYS.length - 1]);
  }
  progress[current.idx] = st;
  saveProgress();
  const card = document.getElementById('currentCard');
  if(card) card.classList.add('confirmed-flash');
  setTimeout(() => {
    const pos = deck.findIndex(w => w.idx === current.idx);
    if(pos !== -1) deck.splice(pos, 1);
    if(reviewIndex >= deck.length) reviewIndex = 0;
    reviewConfirmed.delete(current.idx);
    render();
  }, 260);
}

function restartDeck(){
  buildDeck();
  render();
}

document.getElementById('skipBtn').addEventListener('click', () => {
  if(reviewMode) reviewNext(); else nextCard(false);
});
document.getElementById('masterBtn').addEventListener('click', () => {
  if(reviewMode) confirmReview(); else nextCard(true);
});
document.getElementById('prevBtn').addEventListener('click', () => prevCard());
document.getElementById('restartBtn').addEventListener('click', () => restartDeck());

document.getElementById('randomToggleBtn').addEventListener('click', () => {
  isRandom = !isRandom;
  const btn = document.getElementById('randomToggleBtn');
  btn.textContent = isRandom ? '🔀 ランダム出題: ON' : '🔀 ランダム出題: OFF';
  btn.classList.toggle('btn-on', isRandom);
  buildDeck();
  render();
});

document.getElementById('resetBtn').addEventListener('click', () => {
  const btn = document.getElementById('resetBtn');
  if(btn.textContent === '本当にリセット？'){
    progress = {};
    saveProgress();
    buildDeck();
    render();
    btn.textContent = 'すべてリセット';
    btn.style.color = '';
  } else {
    btn.textContent = '本当にリセット？';
    btn.style.color = '#e11d48';
    setTimeout(() => {
      if(btn.textContent === '本当にリセット？'){
        btn.textContent = 'すべてリセット';
        btn.style.color = '';
      }
    }, 3000);
  }
});

document.getElementById('reviewToggleBtn').addEventListener('click', () => {
  reviewMode = !reviewMode;
  reviewIndex = 0;
  reviewConfirmed.clear();
  const btn = document.getElementById('reviewToggleBtn');
  const banner = document.getElementById('reviewBanner');
  btn.textContent = reviewMode ? '↩ 学習モードに戻る' : '🔁 これまでの単語を復習する';
  btn.classList.toggle('btn-on', reviewMode);
  banner.classList.toggle('show', reviewMode);
  buildDeck();
  render();
});

document.getElementById('reviewFilterSelect').addEventListener('change', (e) => {
  reviewFilter = e.target.value;
  reviewIndex = 0;
  if(reviewMode){
    buildDeck();
    render();
  }
});

document.addEventListener('keydown', (e) => {
  if(e.code === 'Space'){
    e.preventDefault();
    flipCard();
  } else if(e.code === 'ArrowRight'){
    if(reviewMode) reviewNext(); else nextCard(false);
  } else if(e.code === 'ArrowLeft'){
    if(reviewMode) reviewPrev(); else prevCard();
  } else if(e.code === 'Enter'){
    if(reviewMode) confirmReview(); else nextCard(true);
  }
});

window.addEventListener('resize', () => { if(!flipped) fitWordFont(); });

renderSourceFilter();
buildDeck();
render();
</script>

</body>
</html>
