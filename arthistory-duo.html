<style>
:root{
--bg:#fdf2f8;--surface:#ffffff;--primary:#be185d;--primary-light:#fce7f3;
--accent:#c026d3;--green:#16a34a;--green-light:#dcfce7;--amber:#d97706;--amber-light:#fef3c7;
--red:#e11d48;--text:#1e293b;--muted:#64748b;--border:#f9a8d4;
--shadow:0 4px 24px rgba(190,24,93,0.10);--radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);min-height:100vh;padding:2px 12px 48px;color:var(--text);}
.container{max-width:560px;margin:auto;}
.header{text-align:center;margin-bottom:4px;}
.header h2{font-size:18px;font-weight:900;color:var(--primary);}
.header p{font-size:12px;color:var(--muted);margin-top:2px;}
.badges{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:10px;}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:99px;font-size:11px;font-weight:700;background:var(--primary-light);color:var(--primary);border:1px solid var(--border);}
.badge.green{background:var(--green-light);color:var(--green);border-color:#86efac;}
.progress-wrap{background:#fbcfe8;border-radius:99px;height:6px;margin-bottom:4px;overflow:hidden;}
.progress-bar{height:100%;background:var(--primary);border-radius:99px;transition:width 0.4s ease;}
.progress-label{text-align:center;font-size:12px;color:var(--muted);margin-bottom:8px;}
.tap-hint{font-size:11px;color:var(--muted);}
.card{background:var(--surface);border-radius:var(--radius);padding:16px 20px 20px;box-shadow:var(--shadow);margin-bottom:12px;position:relative;border:2px solid var(--border);min-height:160px;cursor:pointer;user-select:none;transition:transform .1s,border-color .2s;}
.card.tappable:active{transform:scale(0.985);}
.card.revealed{border-color:var(--primary);}
.card.no-tap{cursor:default;}
.card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.card-num{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);}
.cat-label{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--primary);text-align:center;flex:1;}
.master-wrap{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);}
.master-wrap input[type=checkbox]{width:17px;height:17px;accent-color:var(--green);cursor:pointer;}
.master-wrap.disabled{opacity:.3;pointer-events:none;}
.main-text{font-size:clamp(14px,3.8vw,18px);font-weight:700;line-height:1.65;text-align:center;margin-bottom:14px;}
.answer-wrap{opacity:0;transform:translateY(5px);transition:opacity .25s,transform .25s;pointer-events:none;}
.answer-wrap.show{opacity:1;transform:translateY(0);pointer-events:auto;}
.answer-ja{font-size:clamp(13px,3.5vw,15px);font-weight:700;color:var(--accent);text-align:center;line-height:1.6;background:#fdf4ff;border-radius:10px;padding:10px 14px;margin-bottom:8px;}
.answer-tip{font-size:12px;font-weight:600;color:var(--green);text-align:left;padding:0 4px;line-height:1.6;}
.answer-tip::before{content:'💡 ';}
.master-badge{display:none;text-align:center;margin-top:8px;background:var(--green-light);color:var(--green);padding:2px 10px;border-radius:99px;font-size:10px;font-weight:700;}
.master-badge.show{display:block;}
.no-active{background:var(--amber-light);border-radius:12px;padding:16px;text-align:center;font-size:14px;color:var(--amber);font-weight:700;display:none;margin-bottom:12px;}
.no-active.show{display:block;}
.auto-panel{background:var(--surface);border-radius:var(--radius);padding:14px 18px;box-shadow:var(--shadow);margin-bottom:12px;display:none;border-left:4px solid var(--primary);}
.auto-panel.show{display:block;}
.auto-step-title{font-size:12px;font-weight:900;color:var(--primary);margin-bottom:4px;}
.auto-instruction{font-size:14px;font-weight:700;color:var(--text);line-height:1.5;}
.auto-count{font-family:'DM Mono',monospace;font-size:12px;color:var(--muted);margin-top:4px;}
.filter-panel{background:var(--surface);border-radius:var(--radius);padding:6px 8px;border:1px solid var(--border);margin-bottom:5px;}
.filter-header{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;}
.filter-header-left{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}
.filter-current{font-size:12px;font-weight:700;color:var(--primary);background:var(--primary-light);padding:3px 10px;border-radius:99px;border:1px solid var(--border);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.filter-toggle-icon{font-size:12px;color:var(--muted);transition:transform .2s;margin-left:6px;}
.filter-toggle-icon.open{transform:rotate(180deg);}
.filter-chips-wrap{display:none;margin-top:10px;}
.filter-chips-wrap.open{display:block;}
.chip-all{display:block;width:100%;padding:6px 12px;margin-bottom:6px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;border:2px solid var(--border);background:#fff;color:var(--muted);text-align:left;font-family:'Noto Sans JP',sans-serif;transition:all .15s;}
.chip-all.active{background:var(--primary-light);color:var(--primary);border-color:var(--primary);}
.cat-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;cursor:pointer;border:2px solid transparent;background:#fff;margin-bottom:4px;transition:all .15s;user-select:none;}
.cat-row.active{background:var(--primary-light);border-color:var(--primary);}
.cat-row-name{flex:1;font-size:13px;font-weight:700;color:var(--text);}
.cat-row.active .cat-row-name{color:var(--primary);}
.cat-row-count{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);background:#f1f5f9;padding:2px 8px;border-radius:99px;font-weight:600;}
.cat-row.active .cat-row-count{background:#fff;color:var(--primary);}
.cat-dot{width:8px;height:8px;border-radius:50%;background:#e2e8f0;flex-shrink:0;}
.cat-dot.done{background:var(--green);}
.panel{background:var(--surface);border-radius:var(--radius);padding:6px 8px;border:1px solid var(--border);margin-bottom:5px;}
.panel-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.panel-row+.panel-row{margin-top:8px;}
.panel label{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap;}
.panel select{flex:1;font-size:12px;border:1px solid var(--border);border-radius:8px;padding:4px 8px;background:#fff;color:var(--text);font-family:'Noto Sans JP',sans-serif;}
.panel input[type=range]{flex:1;min-width:80px;accent-color:var(--primary);}
.speed-val{font-family:'DM Mono',monospace;font-size:13px;font-weight:600;color:var(--primary);min-width:32px;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:10px;}
.btn{border:none;border-radius:99px;padding:8px 14px;font-size:13px;font-weight:700;font-family:'Noto Sans JP',sans-serif;cursor:pointer;transition:opacity .15s,transform .1s;display:inline-flex;align-items:center;gap:5px;}
.btn:active{transform:scale(0.94);opacity:.85;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-secondary{background:#e2e8f0;color:var(--text);}
.btn-red{background:var(--red);color:#fff;}
.btn-amber{background:var(--amber);color:#fff;}
.btn-blue{background:#2563eb;color:#fff;}
.btn-on{background:var(--green);color:#fff;}
.master-summary{background:var(--green-light);border-radius:12px;padding:7px 12px;font-size:12px;color:var(--green);font-weight:700;text-align:center;margin-bottom:8px;display:none;cursor:pointer;user-select:none;}
.master-summary.show{display:block;}
.help-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 14px;border-radius:99px;border:1px solid var(--border);background:var(--primary-light);color:var(--primary);font-size:12px;font-weight:700;cursor:pointer;font-family:'Noto Sans JP',sans-serif;}
.top-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px;}
.audio-mini-label{font-size:10px;color:var(--muted);text-align:center;margin-bottom:4px;font-weight:700;}
.audio-track-row{display:flex;align-items:center;justify-content:center;gap:11px;margin:0 0 16px;flex-wrap:wrap;}
.audio-track-btn{border:1px solid #99f6e4;border-radius:99px;padding:4px 11px;font-size:11px;font-weight:700;cursor:pointer;background:#f0fdfa;color:#0891b2;font-family:'DM Mono',monospace;}
.audio-track-btn.playing{background:#0891b2;color:#fff;border-color:#0891b2;}
.audio-loop-all-btn{border:1px solid var(--border);border-radius:99px;padding:4px 11px;font-size:11px;font-weight:700;cursor:pointer;background:#e2e8f0;color:var(--text);}
.audio-loop-all-btn.on{background:var(--green);color:#fff;border-color:var(--green);}
.profile-select{font-family:'Noto Sans JP',sans-serif;font-size:11px;font-weight:700;color:var(--primary);background:var(--primary-light);border:1px solid var(--border);border-radius:99px;padding:5px 10px;cursor:pointer;max-width:120px;}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h2>🎨 美術史 DUO — No. 1〜100</h2>
</div>

<div class="top-row">
<button class="help-btn" onclick="alert('👆カードタップで答え表示\n🔊音声再生（ネイティブ音声。ファイルがない場合のみ合成音声）\n🗣️シャドウイング4ステップ\n▶連続再生\n🔄英⇄日モード切替\nマスターチェックで次へ\n\n【復習モードの仕組み】\nマスター済みカードは 1日目→3日目→7日目→14日目→30日目→60日目→90日目 の順で自動的に間隔が伸びます\n「覚えていた」を押すたびに次のサイクルへ進みます\n「忘れていた」場合はマスターのチェックを外してください（次にマスターしたらまた1日目から）\nプルダウンで見たいサイクルを選べます（本日復習 / 1日 / 3日 / 7日 / 14日 / 30日 / 60日 / 90日 / すべて）')">❓ 使い方</button>
<select class="profile-select" id="profile-select" onchange="switchProfile(this.value)"></select>

<div class="badge green" id="master-badge-top">マスター: 0 / 100</div>
</div>

<div class="progress-wrap"><div class="progress-bar" id="progress-bar" style="width:2%"></div></div>
<div class="progress-label">カード <span id="cur-num">1</span>/<span id="tot-num">100</span> <span id="tap-hint">・👆タップで訳を表示</span></div>
<div class="no-active" id="no-active">✅ このカテゴリをすべてマスターしました！</div>
<div class="auto-panel" id="auto-panel">
<div class="auto-step-title" id="auto-step-title">STEP 1</div>
<div class="auto-instruction" id="auto-instruction">音声を聴いてください。</div>
<div class="auto-count" id="auto-count"></div>
</div>
<div class="card tappable" id="main-card" onclick="handleTap()">
<div class="card-top">
<div class="card-num" id="card-num">1</div>
<div class="cat-label" id="card-cat"></div>
<div class="master-wrap" id="master-wrap">
<span>マスター</span>
<input type="checkbox" id="master-cb" onchange="toggleMaster(event)" onclick="event.stopPropagation()">
</div>
</div>
<div class="main-text" id="main-text">Loading...</div>
<div class="answer-wrap" id="answer-wrap">
<div class="answer-ja" id="answer-ja"></div>
<div class="answer-tip" id="answer-tip" style="display:none"></div>
</div>
<div class="master-badge" id="mastered-badge">✔ マスター済</div>
</div>
<div class="btn-row" id="review-action-row" style="display:none;gap:8px;margin:-4px 0 10px;">
<button class="btn btn-on" style="flex:1;font-size:12px;padding:8px;" onclick="confirmReviewed()">✅ 覚えていた（今日の日付で更新）</button>
</div>
<div class="master-summary" id="master-summary" onclick="toggleMasterList()"></div>
<div id="master-list-wrap" style="display:none;margin-bottom:12px;">
<div style="background:#fff;border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
<span style="font-size:13px;font-weight:900;color:var(--green);">✅ マスター済みリスト</span>
<button class="btn btn-secondary" id="clear-all-btn" style="padding:4px 12px;font-size:11px;" onclick="clearAllMasterStep1()">全解除</button>
</div>
<div id="master-list"></div>
</div>
</div>
<div class="filter-panel">
<div class="filter-header" onclick="toggleFilterPanel()">
<div class="filter-header-left">📂 カテゴリを選ぶ</div>
<div style="display:flex;align-items:center;gap:4px;">
<div class="filter-current" id="filter-current-label">すべて</div>
<span class="filter-toggle-icon" id="filter-toggle-icon">▼</span>
</div>
</div>
<div class="filter-chips-wrap" id="filter-chips-wrap">
<button class="chip-all active" id="chip-all" onclick="selectCategory('all')">🎯 すべて表示</button>
<div id="cat-rows"></div>
</div>
</div>
<div class="panel">
<div class="panel-row">
<label>速度</label>
<select id="rate-slider" onchange="updateRate()" style="flex:1;font-size:12px;padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);font-family:'Noto Sans JP',sans-serif;">
<option value="0.5">0.5×</option>
<option value="0.6">0.6×</option>
<option value="0.7">0.7×</option>
<option value="0.8">0.8×</option>
<option value="0.9">0.9×</option>
<option value="1.0" selected>1.0×</option>
<option value="1.1">1.1×</option>
<option value="1.2">1.2×</option>
<option value="1.3">1.3×</option>
<option value="1.4">1.4×</option>
<option value="1.5">1.5×</option>
<option value="1.75">1.75×</option>
<option value="2.0">2.0×</option>
</select>
<button class="btn btn-on" style="font-size:11px;padding:6px 10px;" onclick="startMasteredReview()">✅ マスター済み再生</button>
</div>
</div>
<div id="normal-controls">
<div class="btn-row">
<button class="btn btn-secondary" onclick="prev()">← 戻る</button>
<button class="btn btn-primary" onclick="speakCurrent()">🔊 音声</button>
<button class="btn btn-secondary" onclick="next()">次へ →</button>
<button class="btn btn-secondary" style="font-size:11px;padding:8px 6px;" onclick="switchMode()">🔄 英⇄日</button>
</div>
<div class="btn-row" style="gap:4px;">
<button class="btn btn-secondary" style="font-size:11px;padding:7px 5px;" id="random-btn" onclick="toggleRandom()">🔀 ランダム</button>
<button class="btn btn-secondary" style="font-size:11px;padding:7px 5px;" id="repeat-btn" onclick="toggleRepeat()">🔁 繰り返し</button>
<button class="btn btn-blue" style="font-size:11px;padding:7px 5px;" onclick="startContinuous()">▶ 連続再生</button>
<button class="btn btn-amber" style="font-size:11px;padding:7px 5px;" onclick="startShadowing()">🗣️ シャドウ</button>
</div>
<div class="btn-row" style="gap:4px;">
<select id="review-filter-select" style="flex:1;font-size:11px;padding:6px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);font-family:'Noto Sans JP',sans-serif;" onchange="changeReviewFilter()">
<option value="due" selected>本日復習（出題対象のみ）</option>
<option value="s0">1日サイクル</option>
<option value="s1">3日サイクル</option>
<option value="s2">7日サイクル</option>
<option value="s3">14日サイクル</option>
<option value="s4">30日サイクル</option>
<option value="s5">60日サイクル</option>
<option value="s6">90日サイクル</option>
<option value="all">すべて</option>
</select>
<button class="btn btn-secondary" id="review-toggle-btn" style="font-size:11px;padding:7px 8px;flex:1;" onclick="toggleReviewMode()">🔁 復習モード: OFF</button>
</div>
</div>
<div id="auto-controls" style="display:none;">
<div class="btn-row"><button class="btn btn-red" onclick="stopAutoPlay()">⏹ 停止</button></div>
</div>
</div>
<script>
const OFFSET=1;
const CATS={'1-10':'#9b2226','11-20':'#5c4a2e','21-30':'#3d5a80','31-40':'#6a4c93','41-50':'#2a6f6f','51-60':'#a4508b','61-70':'#bb6b1a','71-80':'#4a7c59','81-90':'#7a5195','91-100':'#c1666b'};
const phrases=[
{cat:'1-10', en:'The Venus de Milo is an ancient Greek sculpture believed to represent Aphrodite.', ja:'ミロのヴィーナスは、アフロディーテを表したと考えられる古代ギリシャの彫刻である。', tip:'紀元前130〜100年頃の制作とされる。1820年にミロス島で発見された。'},
{cat:'1-10', en:'Egyptian art followed strict conventions, depicting figures with the head and legs in profile.', ja:'エジプト美術は厳格な様式に従い、頭と脚を横向きに描いた人物像を特徴とした。', tip:'約3000年にわたり様式がほぼ一定していた。壁画や彫刻に共通する規則。'},
{cat:'1-10', en:'The Parthenon in Athens is considered a masterpiece of classical Greek architecture.', ja:'アテネのパルテノン神殿は、古典期ギリシャ建築の傑作とされている。', tip:'紀元前447〜432年に建造。彫刻家フェイディアスが装飾を監督した。'},
{cat:'1-10', en:'Ancient Roman artists excelled at realistic portrait sculpture.', ja:'古代ローマの芸術家は、写実的な肖像彫刻に優れていた。', tip:'皇帝や個人の胸像（バスト）が数多く残る。ギリシャの理想化とは対照的。'},
{cat:'1-10', en:'The frescoes of Pompeii were preserved by the eruption of Mount Vesuvius in 79 CE.', ja:'ポンペイのフレスコ画は、紀元79年のヴェスヴィオ火山噴火によって保存された。', tip:'火山灰に埋もれたことで、古代ローマの絵画が奇跡的に現代まで残った。'},
{cat:'1-10', en:'Greek pottery often depicted scenes from mythology and daily life.', ja:'ギリシャの陶器には、神話や日常生活の場面がしばしば描かれた。', tip:'黒絵式・赤絵式の技法が発達。紀元前6〜5世紀頃に最盛期を迎えた。'},
{cat:'1-10', en:'The Laocoön Group is a famous marble sculpture from ancient Greece or Rome.', ja:'ラオコーン群像は、古代ギリシャまたはローマの有名な大理石彫刻である。', tip:'紀元前1世紀頃の作とされ、1506年にローマで再発見された。'},
{cat:'1-10', en:'Egyptian tomb paintings were meant to accompany the deceased into the afterlife.', ja:'エジプトの墓の壁画は、死者を来世へ導くためのものであった。', tip:'副葬品とともに、死後の生活を保証する宗教的な役割を持っていた。'},
{cat:'1-10', en:'The Colosseum showcases the Romans\' mastery of the arch and concrete construction.', ja:'コロッセウムは、ローマ人によるアーチとコンクリート建築の熟達ぶりを示している。', tip:'80年完成。ローマ建築技術の到達点を象徴する巨大建造物。'},
{cat:'1-10', en:'Classical sculpture idealized the human body according to mathematical proportions.', ja:'古典期の彫刻は、数学的な比率に基づいて人体を理想化した。', tip:'彫刻家ポリュクレイトスが「カノン（規範）」として理想的な人体比を定式化した。'},
{cat:'11-20', en:'Byzantine art is known for its flat, golden mosaics depicting religious figures.', ja:'ビザンティン美術は、宗教的人物を描いた平面的で金色のモザイクで知られる。', tip:'6〜15世紀に発展。ラヴェンナやコンスタンティノープルの聖堂装飾が代表例。'},
{cat:'11-20', en:'Gothic cathedrals featured stained glass windows that told biblical stories through light.', ja:'ゴシック様式の大聖堂には、光を通して聖書の物語を伝えるステンドグラスの窓があった。', tip:'12〜15世紀頃に発展。シャルトル大聖堂などが代表的。'},
{cat:'11-20', en:'Giotto is often credited with bringing greater realism to painting in the 14th century.', ja:'ジョットは、14世紀の絵画により大きな写実性をもたらしたとされることが多い。', tip:'1267頃〜1337年。中世的な平面表現から脱し、奥行きと感情表現を導入した。'},
{cat:'11-20', en:'Illuminated manuscripts combined text and intricate artwork in medieval Europe.', ja:'彩飾写本は、中世ヨーロッパにおいて文字と精緻な装飾芸術を融合させたものであった。', tip:'修道院で制作されることが多かった。金箔や鮮やかな顔料が用いられた。'},
{cat:'11-20', en:'The International Gothic style was known for its elegance and decorative detail.', ja:'国際ゴシック様式は、その優雅さと装飾的な細部で知られていた。', tip:'14世紀末〜15世紀初頭、ヨーロッパ各地の宮廷で流行した様式。'},
{cat:'11-20', en:'Jan van Eyck was a pioneer of oil painting in the early 15th century.', ja:'ヤン・ファン・エイクは、15世紀初頭における油彩画の先駆者であった。', tip:'1390頃〜1441年。フランドル派の画家で、油彩技法を大きく発展させた。'},
{cat:'11-20', en:'Van Eyck\'s "Arnolfini Portrait" is famous for its intricate symbolism and detail.', ja:'ファン・エイクの『アルノルフィーニ夫妻像』は、精緻な象徴表現と細部描写で有名である。', tip:'1434年制作。凸面鏡に描き込まれた反射像でも知られる。'},
{cat:'11-20', en:'Sandro Botticelli painted "The Birth of Venus" during the early Renaissance in Florence.', ja:'サンドロ・ボッティチェリは、フィレンツェの初期ルネサンス期に『ヴィーナスの誕生』を描いた。', tip:'1485年頃の作。メディチ家の庇護のもとで制作された代表作。'},
{cat:'11-20', en:'Filippo Brunelleschi designed the dome of Florence Cathedral using innovative engineering.', ja:'フィリッポ・ブルネレスキは、革新的な工学技術を用いてフィレンツェ大聖堂のドームを設計した。', tip:'1420〜1436年に建設。当時世界最大級のドームで、線遠近法の考案者としても知られる。'},
{cat:'11-20', en:'The Medici family were powerful patrons of Renaissance art in Florence.', ja:'メディチ家は、フィレンツェにおけるルネサンス美術の有力な後援者であった。', tip:'銀行業で富を築き、ボッティチェリやミケランジェロら多くの芸術家を支援した。'},
{cat:'21-30', en:'Leonardo da Vinci painted the Mona Lisa, one of the most famous portraits in art history.', ja:'レオナルド・ダ・ヴィンチは、美術史上最も有名な肖像画の一つであるモナ・リザを描いた。', tip:'1503〜1506年頃制作。現在はルーヴル美術館に所蔵されている。'},
{cat:'21-30', en:'The Mona Lisa is renowned for its subtle smile and use of sfumato.', ja:'モナ・リザは、その微妙な微笑みとスフマート技法の使用で名高い。', tip:'スフマートは輪郭をぼかして描く技法。ダ・ヴィンチが完成させた。'},
{cat:'21-30', en:'Michelangelo painted the ceiling of the Sistine Chapel between 1508 and 1512.', ja:'ミケランジェロは、1508年から1512年にかけてシスティーナ礼拝堂の天井画を描いた。', tip:'教皇ユリウス2世の依頼。「天地創造」の場面などが描かれている。'},
{cat:'21-30', en:'Michelangelo\'s sculpture of David depicts the biblical hero in idealized nude form.', ja:'ミケランジェロによるダビデ像は、聖書の英雄を理想化した裸体で表現している。', tip:'1501〜1504年制作。高さ約5.17メートルの大理石像。フィレンツェに所蔵。'},
{cat:'21-30', en:'Raphael was known for his harmonious compositions and graceful figures.', ja:'ラファエロは、調和のとれた構図と優美な人物表現で知られていた。', tip:'1483〜1520年。ダ・ヴィンチ、ミケランジェロと並ぶ盛期ルネサンスの三巨匠の一人。'},
{cat:'21-30', en:'Raphael\'s "The School of Athens" depicts ancient philosophers gathered together.', ja:'ラファエロの『アテネの学堂』は、古代の哲学者たちが集う様子を描いている。', tip:'1509〜1511年制作。バチカン宮殿の壁画。プラトンとアリストテレスが中央に描かれる。'},
{cat:'21-30', en:'Titian was the leading painter of the Venetian school in the 16th century.', ja:'ティツィアーノは、16世紀のヴェネツィア派を代表する画家であった。', tip:'1488頃〜1576年。豊かな色彩表現で知られ、多くの君主の肖像画も手がけた。'},
{cat:'21-30', en:'The High Renaissance is considered the peak of artistic achievement in Italy.', ja:'盛期ルネサンスは、イタリアにおける芸術的達成の頂点と見なされている。', tip:'おおむね1490年代〜1520年頃を指す。ダ・ヴィンチ、ミケランジェロ、ラファエロが活躍。'},
{cat:'21-30', en:'Perspective techniques allowed Renaissance artists to create the illusion of depth.', ja:'遠近法の技術により、ルネサンスの芸術家たちは奥行きの錯覚を作り出せるようになった。', tip:'ブルネレスキが考案し、後にアルベルティが理論化した線遠近法が基礎となった。'},
{cat:'21-30', en:'Renaissance artists studied human anatomy to portray the body more accurately.', ja:'ルネサンスの芸術家たちは、人体をより正確に表現するために解剖学を学んだ。', tip:'ダ・ヴィンチは実際に解剖を行い、詳細な人体スケッチを多数残した。'},
{cat:'31-40', en:'Albrecht Dürer was a German artist famous for his detailed engravings and self-portraits.', ja:'アルブレヒト・デューラーは、精緻な版画と自画像で有名なドイツの芸術家であった。', tip:'1471〜1528年。北方ルネサンスを代表する画家・版画家。'},
{cat:'31-40', en:'Hieronymus Bosch created fantastical and surreal religious paintings.', ja:'ヒエロニムス・ボスは、幻想的でシュルレアリスム的な宗教画を制作した。', tip:'1450頃〜1516年。『快楽の園』など、独創的で奇怪な図像で知られる。'},
{cat:'31-40', en:'Pieter Bruegel the Elder depicted scenes of peasant life in the 16th century.', ja:'大ピーテル・ブリューゲルは、16世紀の農民生活の情景を描いた。', tip:'1525頃〜1569年。『農民の踊り』などフランドルの日常を活写した。'},
{cat:'31-40', en:'Mannerism emerged in the late Renaissance and featured elongated, distorted figures.', ja:'マニエリスムはルネサンス後期に現れ、引き伸ばされ歪んだ人物像を特徴とした。', tip:'1520年代〜1600年頃。盛期ルネサンスの調和からの意図的な逸脱が特徴。'},
{cat:'31-40', en:'El Greco combined Byzantine tradition with Mannerist style in his religious paintings.', ja:'エル・グレコは、ビザンティンの伝統とマニエリスム様式を宗教画の中で融合させた。', tip:'1541〜1614年。クレタ島出身、スペインのトレドで活動した。'},
{cat:'31-40', en:'Caravaggio revolutionized painting with his dramatic use of light and shadow.', ja:'カラヴァッジョは、劇的な光と影の使い方で絵画に革命をもたらした。', tip:'1571〜1610年。バロック絵画の先駆者とされる。'},
{cat:'31-40', en:'Caravaggio\'s technique of chiaroscuro created intense contrasts between light and dark.', ja:'カラヴァッジョのキアロスクーロ技法は、光と闇の強烈な対比を生み出した。', tip:'キアロスクーロは明暗法の意。強い明暗差で劇的な効果を演出した。'},
{cat:'31-40', en:'Peter Paul Rubens was known for his dynamic compositions and voluptuous figures.', ja:'ペーテル・パウル・ルーベンスは、躍動的な構図と豊満な人物表現で知られていた。', tip:'1577〜1640年。フランドル・バロックを代表する画家。'},
{cat:'31-40', en:'Rembrandt was a master of the Dutch Golden Age, famous for his portraits and self-portraits.', ja:'レンブラントはオランダ黄金時代の巨匠であり、肖像画と自画像で有名であった。', tip:'1606〜1669年。生涯を通じて多数の自画像を残したことでも知られる。'},
{cat:'31-40', en:'Rembrandt\'s "The Night Watch" is renowned for its dramatic use of light.', ja:'レンブラントの『夜警』は、その劇的な光の使い方で名高い。', tip:'1642年制作。集団肖像画に動きと物語性を持ち込んだ革新的な作品。'},
{cat:'41-50', en:'Johannes Vermeer captured quiet domestic scenes with remarkable attention to light.', ja:'ヨハネス・フェルメールは、卓越した光への配慮をもって静かな家庭の情景を描いた。', tip:'1632〜1675年。生涯にわずかな作品しか残さなかったとされる。'},
{cat:'41-50', en:'Vermeer\'s "Girl with a Pearl Earring" is sometimes called the "Mona Lisa of the North."', ja:'フェルメールの『真珠の耳飾りの少女』は、「北のモナ・リザ」と呼ばれることがある。', tip:'1665年頃制作。人物の身元は不明で「北方のモナ・リザ」とも称される。'},
{cat:'41-50', en:'Diego Velázquez served as court painter to King Philip IV of Spain.', ja:'ディエゴ・ベラスケスは、スペイン国王フェリペ4世の宮廷画家を務めた。', tip:'1599〜1660年。スペイン黄金世紀を代表する画家。'},
{cat:'41-50', en:'Velázquez\'s "Las Meninas" is celebrated for its complex composition and perspective.', ja:'ベラスケスの『ラス・メニーナス』は、その複雑な構図と視点の扱いで称賛されている。', tip:'1656年制作。画家自身や鏡に映る国王夫妻を描き込んだ多層的な構成が特徴。'},
{cat:'41-50', en:'The Rococo style favored pastel colors, ornate decoration, and playful themes.', ja:'ロココ様式は、パステルカラーや華美な装飾、遊戯的な主題を好んだ。', tip:'18世紀初頭のフランスで発展。バロックに続く優美で軽やかな様式。'},
{cat:'41-50', en:'Jean-Antoine Watteau\'s paintings captured the elegance of French aristocratic leisure.', ja:'ジャン＝アントワーヌ・ヴァトーの絵画は、フランス貴族の優雅な余暇の様子を捉えた。', tip:'1684〜1721年。「雅宴画（フェート・ギャラント）」というジャンルを確立した。'},
{cat:'41-50', en:'Neoclassicism revived the discipline and simplicity of ancient Greek and Roman art.', ja:'新古典主義は、古代ギリシャ・ローマ美術の規律と簡素さを復興させた。', tip:'18世紀後半〜19世紀初頭に流行。ロココへの反動として生まれた。'},
{cat:'41-50', en:'Jacques-Louis David painted "The Death of Marat" during the French Revolution.', ja:'ジャック＝ルイ・ダヴィッドは、フランス革命の最中に『マラーの死』を描いた。', tip:'1793年制作。革命家マラーの暗殺を悲劇的に描いた新古典主義の名作。'},
{cat:'41-50', en:'David later became the official painter of Napoleon Bonaparte.', ja:'ダヴィッドは後に、ナポレオン・ボナパルトの公式画家となった。', tip:'『ナポレオンの戴冠式』など、皇帝の権威を称える作品を数多く手がけた。'},
{cat:'41-50', en:'Jean-Auguste-Dominique Ingres was known for his precise lines and idealized nudes.', ja:'ジャン＝オーギュスト＝ドミニク・アングルは、精密な線描と理想化された裸体像で知られていた。', tip:'1780〜1867年。ダヴィッドの弟子で、新古典主義の伝統を継承した。'},
{cat:'51-60', en:'Romanticism emphasized emotion, nature, and individual imagination over reason.', ja:'ロマン主義は、理性よりも感情、自然、個人の想像力を重視した。', tip:'18世紀末〜19世紀に興った芸術運動。新古典主義への反発から生まれた。'},
{cat:'51-60', en:'Francisco Goya\'s later works reflected the horrors of war and human suffering.', ja:'フランシスコ・ゴヤの後期の作品は、戦争の惨禍と人間の苦しみを反映していた。', tip:'1746〜1828年。スペインの宮廷画家から、社会批判的な作風へと変化した。'},
{cat:'51-60', en:'Goya\'s "The Third of May 1808" depicts the execution of Spanish civilians by French soldiers.', ja:'ゴヤの『1808年5月3日』は、フランス兵によるスペイン市民の処刑を描いている。', tip:'1814年制作。ナポレオン軍によるスペイン侵略への告発的な作品。'},
{cat:'51-60', en:'Eugène Delacroix\'s "Liberty Leading the People" became a symbol of revolution.', ja:'ウジェーヌ・ドラクロワの『民衆を導く自由の女神』は、革命の象徴となった。', tip:'1830年制作。フランス七月革命を主題とするロマン主義の代表作。'},
{cat:'51-60', en:'J.M.W. Turner was celebrated for his dramatic depictions of light and atmosphere.', ja:'J・M・W・ターナーは、劇的な光と大気の描写で称賛された。', tip:'1775〜1851年。イギリスのロマン主義風景画家で、印象派にも影響を与えた。'},
{cat:'51-60', en:'Caspar David Friedrich\'s landscapes often conveyed a sense of spiritual solitude.', ja:'カスパー・ダーヴィト・フリードリヒの風景画は、しばしば精神的な孤独感を伝えていた。', tip:'1774〜1840年。ドイツ・ロマン主義の代表的画家。『雲海の上の旅人』などが有名。'},
{cat:'51-60', en:'Realism emerged in the mid-19th century as a reaction against Romantic idealism.', ja:'写実主義は19世紀半ば、ロマン主義の理想化への反動として現れた。', tip:'1840年代のフランスで発展。日常や労働者階級をありのままに描いた。'},
{cat:'51-60', en:'Gustave Courbet insisted on painting ordinary people and everyday scenes.', ja:'ギュスターヴ・クールベは、庶民や日常の情景を描くことにこだわった。', tip:'1819〜1877年。「私は天使を見たことがないので描かない」という言葉で知られる。'},
{cat:'51-60', en:'Jean-François Millet depicted the dignity of peasant labor in works like "The Gleaners."', ja:'ジャン＝フランソワ・ミレーは、『落穂拾い』などの作品で農民労働の尊厳を描いた。', tip:'1857年制作の『落穂拾い』が代表作。バルビゾン派の中心人物の一人。'},
{cat:'51-60', en:'The Barbizon School of painters focused on capturing rural landscapes directly from nature.', ja:'バルビゾン派の画家たちは、自然を直接観察して田園風景を描くことに重点を置いた。', tip:'1830〜1870年代、パリ郊外バルビゾン村を拠点に活動した画家集団。'},
{cat:'61-70', en:'Impressionism emerged in France in the 1870s, focusing on light and fleeting moments.', ja:'印象派は1870年代のフランスに現れ、光と移ろいゆく瞬間に焦点を当てた。', tip:'1874年の第一回印象派展が始まりとされる。当初は批評家から酷評された。'},
{cat:'61-70', en:'Claude Monet\'s "Impression, Sunrise" gave the Impressionist movement its name.', ja:'クロード・モネの『印象、日の出』は、印象派という運動名の由来となった。', tip:'1872年制作。批評家が皮肉を込めて用いた「印象派」という語が定着した。'},
{cat:'61-70', en:'Monet painted numerous series depicting the same subject under different light conditions.', ja:'モネは、同じ対象を異なる光の条件のもとで描く連作を数多く手がけた。', tip:'「積みわら」「ルーアン大聖堂」などの連作が有名。光の変化の探求が目的。'},
{cat:'61-70', en:'Monet\'s water lily paintings were created in his garden at Giverny.', ja:'モネの睡蓮の絵画群は、ジヴェルニーの自邸の庭で描かれた。', tip:'晩年の約30年間、200点以上の睡蓮を描いた。オランジュリー美術館に大作が展示される。'},
{cat:'61-70', en:'Pierre-Auguste Renoir often painted joyful scenes of Parisian social life.', ja:'ピエール＝オーギュスト・ルノワールは、パリの社交生活の楽しい情景をしばしば描いた。', tip:'1841〜1919年。『ムーラン・ド・ラ・ギャレットの舞踏会』などが代表作。'},
{cat:'61-70', en:'Edgar Degas frequently depicted ballet dancers and scenes of urban leisure.', ja:'エドガー・ドガは、バレエダンサーや都会の余暇の情景をたびたび描いた。', tip:'1834〜1917年。斬新な構図とパステル技法でも知られる。'},
{cat:'61-70', en:'Berthe Morisot was one of the founding members of the Impressionist movement.', ja:'ベルト・モリゾは、印象派運動の創設メンバーの一人であった。', tip:'1841〜1895年。女性画家として運動初期から参加した重要人物。'},
{cat:'61-70', en:'Édouard Manet\'s "Olympia" scandalized audiences with its frank depiction of a nude woman.', ja:'エドゥアール・マネの『オランピア』は、裸婦を率直に描いたことで観衆にスキャンダルを引き起こした。', tip:'1863年制作、1865年発表。伝統的な裸婦像への挑戦として物議を醸した。'},
{cat:'61-70', en:'Impressionist painters often worked outdoors, a practice known as "en plein air."', ja:'印象派の画家たちはしばしば屋外で制作し、この手法は「アン・プレネール」と呼ばれた。', tip:'チューブ入り絵具の普及が屋外制作を可能にした技術的背景がある。'},
{cat:'61-70', en:'Camille Pissarro was known for his rural landscapes and later embraced pointillism.', ja:'カミーユ・ピサロは田園風景で知られ、後には点描技法も取り入れた。', tip:'1830〜1903年。印象派展すべてに参加した唯一の画家。'},
{cat:'71-80', en:'Post-Impressionism built on Impressionist techniques while emphasizing structure and emotion.', ja:'ポスト印象派は、印象派の技法を土台としながら構造性と感情表現を重視した。', tip:'1880年代〜1900年頃。印象派の次世代にあたる多様な画家たちを指す。'},
{cat:'71-80', en:'Vincent van Gogh created vivid, expressive paintings despite struggling with mental illness.', ja:'フィンセント・ファン・ゴッホは、精神疾患に苦しみながらも鮮烈で表現力豊かな絵画を生み出した。', tip:'1853〜1890年。生涯で2000点以上の作品を残した。'},
{cat:'71-80', en:'Van Gogh\'s "The Starry Night" was painted while he was staying at an asylum in 1889.', ja:'ファン・ゴッホの『星月夜』は、1889年に療養施設に滞在中に描かれた。', tip:'サン＝レミの精神療養院で制作。渦巻く筆致が特徴的な代表作。'},
{cat:'71-80', en:'Van Gogh sold only one painting during his lifetime but became famous after his death.', ja:'ファン・ゴッホは生前に1点しか絵画を売ることができなかったが、死後に有名になった。', tip:'弟テオの支援を受けながら制作を続けた。1890年に37歳で死去。'},
{cat:'71-80', en:'Paul Cézanne\'s structured approach to form influenced the development of Cubism.', ja:'ポール・セザンヌの形態への構造的なアプローチは、キュビスムの発展に影響を与えた。', tip:'1839〜1906年。自然を「円筒・球・円錐」で捉える視点を提示した。'},
{cat:'71-80', en:'Cézanne is often called the "father of modern art" for his innovative use of geometric shapes.', ja:'セザンヌは、幾何学的形態の革新的な用法から「近代絵画の父」と呼ばれることが多い。', tip:'ピカソやブラックなど、20世紀初頭の芸術家たちに大きな影響を与えた。'},
{cat:'71-80', en:'Paul Gauguin left France to live and paint in Tahiti, seeking an escape from Western civilization.', ja:'ポール・ゴーギャンは、西洋文明からの脱却を求めてフランスを離れ、タヒチで暮らし絵を描いた。', tip:'1848〜1903年。1891年に南太平洋へ渡り、原色を用いた独自の様式を確立した。'},
{cat:'71-80', en:'Georges Seurat developed pointillism, a technique using small dots of pure color.', ja:'ジョルジュ・スーラは、純色の小さな点を用いる技法である点描法を編み出した。', tip:'1859〜1891年。色彩理論に基づく科学的な手法として点描を体系化した。'},
{cat:'71-80', en:'Seurat\'s "A Sunday Afternoon on the Island of La Grande Jatte" is a landmark of pointillism.', ja:'スーラの『グランド・ジャット島の日曜日の午後』は、点描技法における画期的な作品である。', tip:'1884〜1886年制作。点描法（新印象主義）を代表する大作。'},
{cat:'71-80', en:'Symbolist artists used imagery to express emotions and ideas rather than depict reality.', ja:'象徴主義の芸術家たちは、現実を描写するよりも感情や観念を表すために図像を用いた。', tip:'19世紀末に興った運動。夢・神秘・内面世界を主題とすることが多かった。'},
{cat:'81-90', en:'Fauvism was characterized by bold, unnatural colors and simplified forms.', ja:'フォーヴィスムは、大胆で不自然な色彩と単純化された形態を特徴とした。', tip:'1905年頃のパリで登場。「野獣派」の名は批評家による皮肉から。'},
{cat:'81-90', en:'Henri Matisse was a leading figure of Fauvism and later famous for his paper cutouts.', ja:'アンリ・マティスはフォーヴィスムの中心人物であり、後には切り紙絵でも有名になった。', tip:'1869〜1954年。晩年は「切り絵」の手法で新たな表現に挑んだ。'},
{cat:'81-90', en:'Pablo Picasso co-founded Cubism, which depicted subjects from multiple viewpoints at once.', ja:'パブロ・ピカソはキュビスムを共同で創始し、対象を複数の視点から同時に描いた。', tip:'1881〜1973年。ジョルジュ・ブラックとともに1907年頃キュビスムを確立した。'},
{cat:'81-90', en:'Picasso\'s "Les Demoiselles d\'Avignon" is considered a groundbreaking work of early Cubism.', ja:'ピカソの『アヴィニョンの娘たち』は、初期キュビスムにおける画期的な作品と見なされている。', tip:'1907年制作。アフリカ美術の影響を受けた、伝統を打ち破る作品。'},
{cat:'81-90', en:'Picasso\'s "Guernica" protested the bombing of a Spanish town during the Civil War.', ja:'ピカソの『ゲルニカ』は、スペイン内戦中の町への爆撃に抗議した作品である。', tip:'1937年制作。ドイツ軍によるゲルニカ空爆を主題とした反戦の名作。'},
{cat:'81-90', en:'Georges Braque worked closely with Picasso in developing Cubist techniques.', ja:'ジョルジュ・ブラックは、キュビスムの技法を発展させる上でピカソと緊密に協働した。', tip:'1882〜1963年。分析的キュビスム・総合的キュビスムの両段階に貢献した。'},
{cat:'81-90', en:'Expressionism conveyed intense emotion through distorted forms and exaggerated colors.', ja:'表現主義は、歪んだ形態と誇張された色彩を通して強烈な感情を伝えた。', tip:'20世紀初頭、主にドイツを中心に発展した芸術運動。'},
{cat:'81-90', en:'Edvard Munch\'s "The Scream" expressed anxiety and existential dread.', ja:'エドヴァルド・ムンクの『叫び』は、不安と実存的な恐怖を表現した。', tip:'1893年制作。表現主義の先駆けとされるノルウェーの画家による代表作。'},
{cat:'81-90', en:'Wassily Kandinsky is often credited as a pioneer of abstract art.', ja:'ワシリー・カンディンスキーは、抽象美術の先駆者としてしばしば評価される。', tip:'1866〜1944年。ロシア出身。音楽的な色彩と形態の関係を探求した。'},
{cat:'81-90', en:'Futurism celebrated speed, technology, and the dynamism of modern life.', ja:'未来派は、速度、技術、そして近代生活のダイナミズムを称揚した。', tip:'1909年、イタリアの詩人マリネッティの宣言から始まった芸術運動。'},
{cat:'91-100', en:'Surrealism explored dreams and the unconscious mind through startling imagery.', ja:'シュルレアリスムは、驚くべき図像を通して夢と無意識の世界を探求した。', tip:'1924年、アンドレ・ブルトンの宣言によって始まった芸術運動。'},
{cat:'91-100', en:'Salvador Dalí\'s "The Persistence of Memory" features melting clocks in a dreamlike landscape.', ja:'サルバドール・ダリの『記憶の固執』は、夢のような風景の中に溶けた時計を描いている。', tip:'1931年制作。柔らかい時計のイメージで広く知られるシュルレアリスムの代表作。'},
{cat:'91-100', en:'René Magritte\'s paintings often challenged the relationship between images and reality.', ja:'ルネ・マグリットの絵画は、イメージと現実の関係にしばしば疑問を投げかけた。', tip:'1898〜1967年。『イメージの裏切り』（パイプの絵に「これはパイプではない」と記した作品）が有名。'},
{cat:'91-100', en:'Frida Kahlo\'s self-portraits explored themes of identity, pain, and Mexican culture.', ja:'フリーダ・カーロの自画像は、アイデンティティ、痛み、メキシコ文化といったテーマを探求した。', tip:'1907〜1954年。事故による身体的苦痛を数多くの自画像に反映させた。'},
{cat:'91-100', en:'Abstract Expressionism emerged in New York after World War II as a major art movement.', ja:'抽象表現主義は、第二次世界大戦後のニューヨークで主要な芸術運動として台頭した。', tip:'1940年代後半〜1950年代。アメリカが美術の中心地となる契機となった。'},
{cat:'91-100', en:'Jackson Pollock became famous for his drip painting technique.', ja:'ジャクソン・ポロックは、絵具を滴らせる技法（ドリッピング）で有名になった。', tip:'1912〜1956年。キャンバスを床に置き、絵具を垂らして描く手法を確立した。'},
{cat:'91-100', en:'Mark Rothko\'s large color field paintings aimed to evoke deep emotional responses.', ja:'マーク・ロスコの大画面によるカラーフィールド絵画は、深い感情的反応を呼び起こすことを目指した。', tip:'1903〜1970年。大きな色面を並置し、瞑想的な効果を狙った。'},
{cat:'91-100', en:'Andy Warhol turned everyday consumer products into iconic works of Pop Art.', ja:'アンディ・ウォーホルは、日常の消費財をポップアートの象徴的な作品へと変えた。', tip:'1928〜1987年。缶詰スープの絵などで、大量消費文化を主題とした。'},
{cat:'91-100', en:'Warhol\'s silkscreen prints of Marilyn Monroe became some of the most recognizable images of the 20th century.', ja:'ウォーホルによるマリリン・モンローのシルクスクリーン版画は、20世紀を代表するイメージの一つとなった。', tip:'1962年、モンローの死の直後に制作。反復と鮮やかな色彩が特徴。'},
{cat:'91-100', en:'Contemporary art continues to challenge traditional definitions of what art can be.', ja:'現代美術は、芸術とは何かという従来の定義に、今なお挑戦し続けている。', tip:'インスタレーション、パフォーマンス、デジタルアートなど多様な形式が展開している。'}
];

  nativeAudioEl.pause();
  nativeAudioEl.onended=null;
  nativeAudioEl.onerror=null;
  if(!audioFile){ if(onError)onError(); return; }
  nativeAudioEl.src=audioFile;
  nativeAudioEl.currentTime=0;

let currentIndex=0,isEnToJa=true,isRandom=false,isRepeating=false;
let mastered=new Set(),activeCategory='all';
const APP_ID='duo01';
const PROFILES_KEY='duo_profiles';
const CURRENT_PROFILE_KEY='duo_current_profile';
function getProfiles(){try{const raw=localStorage.getItem(PROFILES_KEY);const arr=raw?JSON.parse(raw):[];return arr.length?arr:['本人'];}catch(e){return ['本人'];}}
function saveProfiles(arr){try{localStorage.setItem(PROFILES_KEY,JSON.stringify(arr));}catch(e){}}
function getCurrentProfile(){try{return localStorage.getItem(CURRENT_PROFILE_KEY)||getProfiles()[0];}catch(e){return '本人';}}
function setCurrentProfile(name){try{localStorage.setItem(CURRENT_PROFILE_KEY,name);}catch(e){}}
function masteredStorageKey(profile){return 'duo_mastered_'+APP_ID+'_'+profile;}
function loadMastered(){const profile=getCurrentProfile();try{const raw=localStorage.getItem(masteredStorageKey(profile));mastered=new Set(raw?JSON.parse(raw):[]);}catch(e){mastered=new Set();}try{const rawR=localStorage.getItem(masteredStorageKey(profile)+'_review');masteredReview=rawR?JSON.parse(rawR):{};}catch(e){masteredReview={};}}
function saveMastered(){const profile=getCurrentProfile();try{localStorage.setItem(masteredStorageKey(profile),JSON.stringify([...mastered]));localStorage.setItem(masteredStorageKey(profile)+'_review',JSON.stringify(masteredReview));}catch(e){}}
function renderProfileSelect(){const sel=document.getElementById('profile-select');if(!sel)return;const profiles=getProfiles();const current=getCurrentProfile();sel.innerHTML=profiles.map(p=>'<option value="'+p+'"'+(p===current?' selected':'')+'>'+p+'</option>').join('')+'<option value="__new__">＋ 新しいユーザー…</option>';}
function switchProfile(value){if(value==='__new__'){const name=prompt('新しいユーザー名を入力してください（例：妻、孫）');if(!name){renderProfileSelect();return;}const trimmed=name.trim();if(!trimmed){renderProfileSelect();return;}const profiles=getProfiles();if(!profiles.includes(trimmed)){profiles.push(trimmed);saveProfiles(profiles);}setCurrentProfile(trimmed);}else{setCurrentProfile(value);}loadMastered();currentIndex=0;renderProfileSelect();update();}

let isAutoPlaying=false,autoStopped=false,autoTimeout=null,reviewMasteredMode=false,masteredReview={},reviewMode=false,reviewFilter='due',reviewSessionDone=new Set();
let isSpeaking=false,keepAliveTimer=null,speechRate=1.0,voices=[];
function reviewDueDate(days){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+days);return d.getTime();}
function addDays(ms,days){const d=new Date(ms);d.setDate(d.getDate()+days);return d.getTime();}
const REVIEW_INTERVALS=[1,3,7,14,30,60,90];
function getActive(){return phrases.filter((p,i)=>{if(activeCategory!=='all'&&p.cat!==activeCategory)return false;if(reviewMode){if(!mastered.has(i))return false;if(reviewSessionDone.has(i))return false;const rd=masteredReview[i];const stage=rd?rd.stage:0;const due=rd?rd.due:0;if(reviewFilter==='all')return true;if(reviewFilter==='due')return Date.now()>=due;return stage===parseInt(reviewFilter.slice(1));}if(reviewMasteredMode)return mastered.has(i);if(mastered.has(i))return false;return true;});}
function buildCatRows(){const wrap=document.getElementById('cat-rows');wrap.innerHTML='';Object.keys(CATS).forEach(cat=>{const total=phrases.filter(p=>p.cat===cat).length;const mc=phrases.filter((p,i)=>p.cat===cat&&mastered.has(i)).length;const row=document.createElement('div');row.className='cat-row'+(activeCategory===cat?' active':'');row.innerHTML=`<div class="cat-dot${mc===total?' done':''}"></div><div class="cat-row-name">${cat}</div><div class="cat-row-count">${mc}/${total}</div>`;row.onclick=()=>selectCategory(cat);wrap.appendChild(row);});}
function selectCategory(cat){activeCategory=cat;currentIndex=0;document.getElementById('chip-all').className='chip-all'+(cat==='all'?' active':'');buildCatRows();updateFilterLabel();update();document.getElementById('filter-chips-wrap').classList.remove('open');document.getElementById('filter-toggle-icon').classList.remove('open');}
function updateFilterLabel(){document.getElementById('filter-current-label').textContent=activeCategory==='all'?'すべて':activeCategory;}
function toggleFilterPanel(){document.getElementById('filter-chips-wrap').classList.toggle('open');document.getElementById('filter-toggle-icon').classList.toggle('open');}
function loadVoices(){const all=window.speechSynthesis.getVoices();const okNames=new Set(['Microsoft Ava Online (Natural) - English (United States)','Microsoft Andrew Online (Natural) - English (United States)','Microsoft Emma Online (Natural) - English (United States)','Microsoft Brian Online (Natural) - English (United States)','Microsoft Jenny Online (Natural) - English (United States)','Microsoft Guy Online (Natural) - English (United States)','Microsoft Aria Online (Natural) - English (United States)','Microsoft Ana Online (Natural) - English (United States)','Microsoft Christopher Online (Natural) - English (United States)','Microsoft Eric Online (Natural) - English (United States)','Microsoft Michelle Online (Natural) - English (United States)','Microsoft Steffan Online (Natural) - English (United States)','Microsoft Ava Multilingual Online (Natural) - English (United States)','Microsoft Andrew Multilingual Online (Natural) - English (United States)','Microsoft Emma Multilingual Online (Natural) - English (United States)','Microsoft Brian Multilingual Online (Natural) - English (United States)','Microsoft Hazel - English (United Kingdom)','Microsoft Susan - English (United Kingdom)','Microsoft George - English (United Kingdom)','Microsoft Libby Online (Natural) - English (United Kingdom)','Microsoft Maisie Online (Natural) - English (United Kingdom)','Microsoft Thomas Online (Natural) - English (United Kingdom)','Microsoft Sonia Online (Natural) - English (United Kingdom)','Microsoft Ryan Online (Natural) - English (United Kingdom)','Microsoft William Online (Natural) - English (Australia)','Microsoft Natasha Online (Natural) - English (Australia)','Microsoft Clara Online (Natural) - English (Canada)','Microsoft Liam Online (Natural) - English (Canada)','Microsoft Leah Online (Natural) - English (South Africa)','Microsoft Luke Online (Natural) - English (South Africa)','Microsoft Emily Online (Natural) - English (Ireland)','Microsoft Connor Online (Natural) - English (Ireland)','Microsoft Yan Online (Natural) - English (Hong Kong SAR)','Microsoft Sam Online (Natural) - English (Hong Kong SAR)','Microsoft Asilia Online (Natural) - English (Kenya)','Microsoft Chilemba Online (Natural) - English (Kenya)','Microsoft Ezinne Online (Natural) - English (Nigeria)','Microsoft Abeo Online (Natural) - English (Nigeria)','Microsoft Molly Online (Natural) - English (New Zealand)','Microsoft Luna Online (Natural) - English (Singapore)','Microsoft Imani Online (Natural) - English (Tanzania)','Microsoft Elimu Online (Natural) - English (Tanzania)','Microsoft James Online (Natural) - English (Philippines)','Microsoft Neerja Online (Natural) - English (India)','Microsoft Prabhat Online (Natural) - English (India)']);const wl=all.filter(v=>okNames.has(v.name));voices=wl.length?wl:all.filter(v=>v.lang.startsWith('en'));if(!voices.length)voices=all;voices=[...voices].sort((a,b)=>{const pref=['en-US','en-GB','en-AU','en-SG'];const ai=pref.findIndex(p=>a.lang.startsWith(p));const bi=pref.findIndex(p=>b.lang.startsWith(p));return(ai<0?99:ai)-(bi<0?99:bi);});}
loadVoices();
window.speechSynthesis.onvoiceschanged=loadVoices;
function getVoice(){return voices[0]||null;}
function updateRate(){speechRate=parseFloat(document.getElementById('rate-slider').value);if(!nativeAudioEl.paused){nativeAudioEl.playbackRate=speechRate;}}
function startKeepAlive(){stopKeepAlive();keepAliveTimer=setInterval(()=>{if(window.speechSynthesis.speaking)window.speechSynthesis.pause(),window.speechSynthesis.resume();},10000);}
function stopKeepAlive(){if(keepAliveTimer){clearInterval(keepAliveTimer);keepAliveTimer=null;}}
function speakTTS(text,onEnd){window.speechSynthesis.cancel();isSpeaking=false;clearTimeout(speakOne._t);speakOne._t=setTimeout(()=>{const utt=new SpeechSynthesisUtterance(text);const v=getVoice();if(v){utt.voice=v;utt.lang=v.lang;}else{utt.lang='en-US';}utt.rate=speechRate;utt.onend=()=>{isSpeaking=false;stopKeepAlive();if(onEnd)onEnd();};utt.onerror=()=>{isSpeaking=false;stopKeepAlive();if(onEnd)onEnd();};isSpeaking=true;startKeepAlive();window.speechSynthesis.speak(utt);},80);}
speakOne._t=null;
function speakOne(card,onEnd){
  window.speechSynthesis.cancel();
  stopNativeAudio();
  if(card&&card.audio){
    playNativeAudio(card.audio,onEnd,()=>{ speakTTS(card.en,onEnd); });
  } else {
    speakTTS(card.en,onEnd);
  }
}
function speakP(){return new Promise(r=>{const a=getActive();if(!a.length){r();return;}speakOne(a[currentIndex],r);});}
function speakCurrent(){const a=getActive();if(!a.length)return;speakOne(a[currentIndex]);}
function speakRepeat(){if(!isRepeating||isAutoPlaying)return;const a=getActive();if(!a.length)return;speakOne(a[currentIndex],()=>{if(isRepeating&&!isAutoPlaying){clearTimeout(speakRepeat._t);speakRepeat._t=setTimeout(()=>speakRepeat(),300);}}); }
speakRepeat._t=null;
function toggleRepeat(){isRepeating=!isRepeating;const btn=document.getElementById('repeat-btn');btn.textContent=isRepeating?'🔁 繰り返し: ON':'🔁 繰り返し';btn.className=isRepeating?'btn btn-on':'btn btn-secondary';if(isRepeating){const a=getActive();if(a.length)speakRepeat();}else{window.speechSynthesis.cancel();stopNativeAudio();isSpeaking=false;stopKeepAlive();clearTimeout(speakRepeat._t);}}
function update(){const active=getActive();const noEl=document.getElementById('no-active');if(!active.length){noEl.classList.add('show');const catMasteredCount=[...mastered].filter(idx=>activeCategory==='all'||phrases[idx].cat===activeCategory).length;let emptyMsg='🔁 対象のカードがありません';if(catMasteredCount===0){emptyMsg='🔁 マスター済みのカードがまだありません';}else if(reviewFilter==='due'){emptyMsg='🔁 今日復習が必要なカードはありません（また後でチェックしてください）';}else if(reviewFilter==='all'){emptyMsg='🔁 対象のカードがありません';}else{emptyMsg='🔁 このサイクルのカードは今ありません';}noEl.textContent=reviewMode?emptyMsg:'✅ このカテゴリをすべてマスターしました！';document.getElementById('main-card').style.display='none';document.getElementById('tap-hint').style.display='none';const rar0=document.getElementById('review-action-row');if(rar0)rar0.style.display='none';updateMasterBadge();buildCatRows();return;}noEl.classList.remove('show');document.getElementById('main-card').style.display='';document.getElementById('tap-hint').style.display='';const rar=document.getElementById('review-action-row');if(rar)rar.style.display=reviewMode?'':'none';if(currentIndex>=active.length)currentIndex=0;const item=active[currentIndex];const realIdx=phrases.indexOf(item);document.getElementById('card-num').textContent=String(realIdx+OFFSET).padStart(3,'0');document.getElementById('card-cat').textContent=item.cat;document.getElementById('cur-num').textContent=currentIndex+1;document.getElementById('tot-num').textContent=active.length;const pct=active.length>1?((currentIndex/(active.length-1))*100).toFixed(0):100;document.getElementById('progress-bar').style.width=pct+'%';if(isEnToJa){document.getElementById('main-text').innerHTML=item.en;document.getElementById('answer-ja').textContent=item.ja;}else{document.getElementById('main-text').innerHTML=item.ja;document.getElementById('answer-ja').textContent=item.en;}const tipEl=document.getElementById('answer-tip');if(item.tip){tipEl.textContent=item.tip;tipEl.style.display='';}else{tipEl.style.display='none';}document.getElementById('answer-wrap').classList.remove('show');document.getElementById('main-card').classList.remove('revealed');const cb=document.getElementById('master-cb');cb.checked=mastered.has(realIdx);if(mastered.has(realIdx))document.getElementById('mastered-badge').classList.add('show');else document.getElementById('mastered-badge').classList.remove('show');updateMasterBadge();buildCatRows();}
function updateMasterBadge(){const cnt=mastered.size;document.getElementById('master-badge-top').textContent=`マスター: ${cnt} / ${phrases.length}`;const sumEl=document.getElementById('master-summary');if(cnt>0){sumEl.classList.add('show');sumEl.textContent=`✅ マスター済み: ${cnt}件 — タップしてリスト表示`;renderMasterList();}else sumEl.classList.remove('show');}
function renderMasterList(){const listEl=document.getElementById('master-list');listEl.innerHTML='';[...mastered].sort((a,b)=>a-b).forEach(idx=>{const item=phrases[idx];const d=document.createElement('div');d.style.cssText='padding:8px 0;border-bottom:1px solid #f8fafc;font-size:12px;';d.innerHTML=`<span style="font-family:monospace;font-size:10px;color:#64748b;">${String(idx+OFFSET).padStart(3,'0')}</span> ${item.en.substring(0,55)}...`;listEl.appendChild(d);});}
function toggleMasterList(){const w=document.getElementById('master-list-wrap');w.style.display=w.style.display==='none'?'':'none';}
function clearAllMasterStep1(){const btn=document.getElementById('clear-all-btn');if(!btn)return;btn.textContent='本当に全解除？';btn.style.background='#e11d48';btn.style.color='#fff';btn.onclick=clearAllMasterStep2;setTimeout(()=>{if(btn.textContent==='本当に全解除？'){btn.textContent='全解除';btn.style.background='';btn.style.color='';btn.onclick=clearAllMasterStep1;}},3000);}
function clearAllMasterStep2(){mastered.clear();masteredReview={};saveMastered();currentIndex=0;document.getElementById('master-list-wrap').style.display='none';const btn=document.getElementById('clear-all-btn');if(btn){btn.textContent='全解除';btn.style.background='';btn.style.color='';btn.onclick=clearAllMasterStep1;}update();}
function handleTap(){if(isAutoPlaying)return;const wrap=document.getElementById('answer-wrap');if(!wrap.classList.contains('show')){wrap.classList.add('show');document.getElementById('main-card').classList.add('revealed');}}
function toggleMaster(e){const active=getActive();if(!active.length)return;const item=active[currentIndex];const realIdx=phrases.indexOf(item);if(e.target.checked){mastered.add(realIdx);const origin=reviewDueDate(0);masteredReview[realIdx]={stage:0,origin:origin,due:addDays(origin,REVIEW_INTERVALS[0])};document.getElementById('mastered-badge').classList.add('show');setTimeout(()=>{if(currentIndex>=getActive().length)currentIndex=0;update();},400);}else{mastered.delete(realIdx);delete masteredReview[realIdx];document.getElementById('mastered-badge').classList.remove('show');}saveMastered();updateMasterBadge();buildCatRows();}
function confirmReviewed(){const active=getActive();if(!active.length)return;const item=active[currentIndex];const realIdx=phrases.indexOf(item);if(reviewSessionDone.has(realIdx))return;reviewSessionDone.add(realIdx);const prev=masteredReview[realIdx];const origin=(prev&&prev.origin)?prev.origin:reviewDueDate(0);const prevStage=prev?prev.stage:-1;const newStage=Math.min(prevStage+1,REVIEW_INTERVALS.length-1);let due;if(prevStage<REVIEW_INTERVALS.length-1){due=addDays(origin,REVIEW_INTERVALS[newStage]);}else{due=reviewDueDate(REVIEW_INTERVALS[REVIEW_INTERVALS.length-1]);}masteredReview[realIdx]={stage:newStage,origin:origin,due:due};saveMastered();if(currentIndex>=getActive().length)currentIndex=0;update();}
function toggleReviewMode(){reviewMode=!reviewMode;if(reviewMode)reviewSessionDone.clear();const btn=document.getElementById('review-toggle-btn');if(reviewMode){btn.textContent='🔁 復習モード: ON';btn.className='btn btn-on';}else{btn.textContent='🔁 復習モード: OFF';btn.className='btn btn-secondary';}currentIndex=0;update();}
function changeReviewFilter(){reviewFilter=document.getElementById('review-filter-select').value;currentIndex=0;if(reviewMode)update();}
function next(){const a=getActive();if(!a.length)return;if(isRandom)currentIndex=Math.floor(Math.random()*a.length);else currentIndex=(currentIndex+1)%a.length;update();if(isRepeating){clearTimeout(speakRepeat._t);speakRepeat();}}
function prev(){const a=getActive();if(!a.length)return;currentIndex=(currentIndex-1+a.length)%a.length;update();if(isRepeating){clearTimeout(speakRepeat._t);speakRepeat();}}
function toggleRandom(){isRandom=!isRandom;const btn=document.getElementById('random-btn');btn.textContent=isRandom?'🔀 ランダム: ON':'🔀 ランダム: OFF';btn.className=isRandom?'btn btn-on':'btn btn-secondary';}
function switchMode(){if(isAutoPlaying)return;isEnToJa=!isEnToJa;update();}
function delayP(ms){return new Promise(r=>{if(autoStopped){r();return;}autoTimeout=setTimeout(r,ms);});}
function setAutoPanel(s,i,c){document.getElementById('auto-step-title').textContent=s;document.getElementById('auto-instruction').textContent=i;document.getElementById('auto-count').textContent=c;}
function enterAutoUI(){reviewMode=false;reviewSessionDone.clear();const rb0=document.getElementById('review-toggle-btn');if(rb0){rb0.textContent='🔁 復習モード: OFF';rb0.className='btn btn-secondary';}const rar1=document.getElementById('review-action-row');if(rar1)rar1.style.display='none';isAutoPlaying=true;autoStopped=false;document.getElementById('normal-controls').style.display='none';document.getElementById('auto-controls').style.display='';document.getElementById('auto-panel').classList.add('show');document.getElementById('tap-hint').style.display='none';document.getElementById('master-wrap').classList.add('disabled');document.getElementById('main-card').classList.remove('tappable');document.getElementById('main-card').classList.add('no-tap');}
function exitAutoUI(){autoStopped=true;isAutoPlaying=false;window.speechSynthesis.cancel();stopNativeAudio();isSpeaking=false;stopKeepAlive();clearTimeout(speakOne._t);if(autoTimeout){clearTimeout(autoTimeout);autoTimeout=null;}document.getElementById('normal-controls').style.display='';document.getElementById('auto-controls').style.display='none';document.getElementById('auto-panel').classList.remove('show');document.getElementById('tap-hint').style.display='';document.getElementById('master-wrap').classList.remove('disabled');document.getElementById('main-card').classList.add('tappable');document.getElementById('main-card').classList.remove('no-tap');}
function stopAutoPlay(){exitAutoUI();reviewMasteredMode=false;update();}
function showHidden(){document.getElementById('main-text').textContent='？？？';document.getElementById('answer-wrap').classList.remove('show');document.getElementById('main-card').classList.remove('revealed');}
function showAll(){const a=getActive();if(!a.length)return;document.getElementById('main-text').innerHTML=a[currentIndex].en;document.getElementById('answer-wrap').classList.add('show');document.getElementById('main-card').classList.add('revealed');}
async function runShadowing(){const active=getActive();if(!active.length){stopAutoPlay();return;}const si=currentIndex;for(let i=0;i<active.length;i++){if(autoStopped)break;currentIndex=(si+i)%active.length;update();const n=i+1,tot=active.length;showHidden();setAutoPanel(`カード ${n}/${tot} — STEP 1`,'👂 発話せずに2回聴いてください。','1/2回目…');await speakP();if(autoStopped)break;await delayP(350);if(autoStopped)break;setAutoPanel(`カード ${n}/${tot} — STEP 1`,'👂 発話せずに2回聴いてください。','2/2回目…');await speakP();if(autoStopped)break;await delayP(450);if(autoStopped)break;showHidden();setAutoPanel(`カード ${n}/${tot} — STEP 2`,'🗣️ 音声に合わせてシャドウイングしてください。','1/2回目…');await speakP();if(autoStopped)break;await delayP(350);if(autoStopped)break;setAutoPanel(`カード ${n}/${tot} — STEP 2`,'🗣️ 音声に合わせてシャドウイングしてください。','2/2回目…');await speakP();if(autoStopped)break;await delayP(450);if(autoStopped)break;showAll();setAutoPanel(`カード ${n}/${tot} — STEP 3`,'📖 英文・日本語訳を見ながら2回シャドウイング。','1/2回目…');await speakP();if(autoStopped)break;await delayP(350);if(autoStopped)break;setAutoPanel(`カード ${n}/${tot} — STEP 3`,'📖 英文・日本語訳を見ながら2回シャドウイング。','2/2回目…');await speakP();if(autoStopped)break;await delayP(450);if(autoStopped)break;showHidden();setAutoPanel(`カード ${n}/${tot} — STEP 4`,'🙈 何も見ずに2回シャドウイングしてください。','1/2回目…');await speakP();if(autoStopped)break;await delayP(350);if(autoStopped)break;setAutoPanel(`カード ${n}/${tot} — STEP 4`,'🙈 何も見ずに2回シャドウイングしてください。','2/2回目…');await speakP();if(autoStopped)break;await delayP(700);}if(!autoStopped){setAutoPanel('完了！','🎉 シャドウイング完了しました！','');await delayP(2000);stopAutoPlay();}}
function startShadowing(){if(!getActive().length){alert('出題できるカードがありません。');return;}enterAutoUI();runShadowing();}
async function runContinuous(){let lc=0;while(!autoStopped){const active=getActive();if(!active.length){stopAutoPlay();return;}lc++;const si=currentIndex;for(let i=0;i<active.length;i++){if(autoStopped)break;currentIndex=(si+i)%active.length;update();document.getElementById('answer-wrap').classList.add('show');document.getElementById('main-card').classList.add('revealed');setAutoPanel(`連続再生 ${i+1}/${active.length}（${lc}周目）`,'▶ 英語音声を再生中 — ⏹ 停止ボタンで終了','');await speakP();if(autoStopped)break;await delayP(500);}if(!autoStopped)currentIndex=0;}}
function startContinuous(){if(!getActive().length){alert('出題できるカードがありません。');return;}enterAutoUI();runContinuous();}
function startMasteredReview(){reviewMasteredMode=true;if(!getActive().length){reviewMasteredMode=false;alert('マスター済みのカードがありません。');return;}currentIndex=0;enterAutoUI();runContinuous();}
loadMastered();renderProfileSelect();buildCatRows();updateFilterLabel();update();
</script>
<script>
(function() {
var startX = 0, startY = 0;
document.addEventListener('touchstart', function(e) {
startX = e.touches[0].clientX;
startY = e.touches[0].clientY;
}, { passive: true });
document.addEventListener('touchend', function(e) {
var dx = e.changedTouches[0].clientX - startX;
var dy = e.changedTouches[0].clientY - startY;
if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
if (dx < 0) next();
else prev();
}
}, { passive: true });
})();
</script>
